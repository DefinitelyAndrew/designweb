<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRMD – Circle Line C851E</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=VT323&display=swap" rel="stylesheet">
<style>
@font-face {
    font-family: 'LTAIdentity';
    src: url('fonts/LTAIdentity-Medium.woff2') format('woff2'),
         url('fonts/LTAIdentity-Medium.woff') format('woff');
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
    background: #1e1e1e;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 20px 16px;
    font-family: 'Montserrat', sans-serif;
}

/* ═══════════════════════════════════════════════════
   DRMD OUTER — metallic silver bezel
═══════════════════════════════════════════════════ */
.drmd-outer {
    width: 100%;
    max-width: 980px;
    background: linear-gradient(180deg, #c8caca 0%, #9fa3a3 40%, #b0b4b4 100%);
    border-radius: 10px;
    padding: 5px 5px 6px 5px;
    box-shadow:
        0 4px 18px rgba(0,0,0,0.55),
        inset 0 1px 0 rgba(255,255,255,0.25),
        inset 0 -1px 0 rgba(0,0,0,0.3);
}

/* ═══════════════════════════════════════════════════
   DRMD PANEL — white display surface
═══════════════════════════════════════════════════ */
.drmd-panel {
    background: #edeeed;
    border-radius: 6px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.10);
}

/* ── LED ticker strip ── */
.led-outer {
    background-color: #050505;
    background-image:
        repeating-linear-gradient(0deg,   transparent, transparent 3px, rgba(0,0,0,0.22) 3px, rgba(0,0,0,0.22) 4px),
        repeating-linear-gradient(90deg,  transparent, transparent 3px, rgba(0,0,0,0.10) 3px, rgba(0,0,0,0.10) 4px);
    height: 34px;
    display: flex;
    align-items: center;
    overflow: hidden;
    position: relative;
    border-bottom: 1px solid #000;
}
.led-text {
    font-family: 'VT323', monospace;
    font-size: 23px;
    color: #c8e87a;
    white-space: nowrap;
    letter-spacing: 0.06em;
    line-height: 1;
    text-shadow: 0 0 8px #b0d040, 0 0 2px #c8e87a, 0 0 18px rgba(180,220,60,0.35);
    position: relative;
    z-index: 1;
    padding-left: 100%;
    animation: ledScroll 32s linear infinite;
    will-change: transform;
    display: block;
}
.led-text.static {
    padding-left: 0;
    animation: none;
    width: 100%;
    text-align: center;
}
@keyframes ledScroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-100%); }
}

/* ── Main row: door zones + route strip ── */
.main-row {
    display: flex;
    align-items: stretch;
    flex: 1;
}

/* ── Door indicator zones ── */
.door-zone {
    flex-shrink: 0;
    width: 62px;
    display: flex;
    align-items: center;
    justify-content: center;
}
.door-tri {
    width: 0; height: 0;
    opacity: 0.08;
    transition: opacity 0.15s, filter 0.15s;
    filter: drop-shadow(0 0 0px #39e030);
}
.door-tri.active {
    opacity: 1;
    filter: drop-shadow(0 0 6px #39e030) drop-shadow(0 0 16px rgba(57,224,48,0.55));
}
.door-tri.blink { animation: doorBlink 0.65s step-start infinite; }
@keyframes doorBlink { 50% { opacity: 0; } }
.door-zone.left  .door-tri {
    border-top: 24px solid transparent;
    border-bottom: 24px solid transparent;
    border-right: 32px solid #39e030;
}
.door-zone.right .door-tri {
    border-top: 24px solid transparent;
    border-bottom: 24px solid transparent;
    border-left: 32px solid #39e030;
}

/* ── Route strip area ── */
.route-area {
    flex: 1;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 6px 0 8px 0;
}

/* Capslet top-left */
.map-capslet {
    position: absolute;
    top: 4px; left: 2px;
    display: inline-flex;
    align-items: center;
    gap: 3px;
    background: #f99d25;
    color: #000;
    font-family: 'LTAIdentity', sans-serif;
    font-size: 7px;
    padding: 2px 6px 2px 3px;
    border-radius: 20px;
    z-index: 10;
    line-height: 1;
}
.map-capslet-dot {
    width: 13px; height: 13px;
    background: #000; color: #f99d25;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 5.5px; font-weight: 700;
    font-family: 'LTAIdentity', sans-serif;
    flex-shrink: 0;
}

/* Legend top-right */
.legend {
    position: absolute;
    top: 4px; right: 2px;
    display: flex;
    flex-direction: column;
    gap: 1.5px;
    z-index: 5;
}
.legend-item {
    display: flex; align-items: center; gap: 3px;
    font-family: 'LTAIdentity', sans-serif;
    font-size: 5.5px; color: #333; line-height: 1.2;
}
.legend-line { width: 12px; height: 3px; border-radius: 1.5px; flex-shrink: 0; }

/* Orange diamond bottom-centre */
.diamond-wrap {
    position: absolute;
    bottom: 4px; left: 50%;
    transform: translateX(-50%);
    z-index: 20;
}
.diamond-wrap .diamond {
    width: 11px; height: 11px;
    background: #f99d25;
    transform: rotate(45deg);
    box-shadow: 0 0 5px rgba(249,157,37,0.8), 0 0 10px rgba(249,157,37,0.4);
}

/* The scrollable SVG viewport */
.route-svg-wrap {
    width: 100%;
    overflow: hidden;
    position: relative;
}
#routeSvg {
    display: block;
    /* width set by JS to fit all stations */
    transition: transform 0.6s cubic-bezier(0.4,0,0.2,1);
}

/* ═══════════════════════════════════════════════════
   CONTROLS
═══════════════════════════════════════════════════ */
.controls {
    width: 100%; max-width: 980px;
    display: flex; flex-direction: column; gap: 10px;
}
.ctrl-row { display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
.ctrl-lbl {
    font-size: 10px; font-weight: 700; color: #555;
    letter-spacing: 0.1em; text-transform: uppercase;
    min-width: 110px; padding-top: 7px; flex-shrink: 0;
}
.btn-grp { display: flex; gap: 6px; flex-wrap: wrap; }
.btn {
    font-family: 'Montserrat', sans-serif;
    font-size: 11px; font-weight: 600;
    padding: 6px 13px; border-radius: 7px;
    border: 1px solid #3a3a3a; background: #222; color: #666;
    cursor: pointer; transition: all 0.12s; white-space: nowrap;
}
.btn:hover { background: #2a2a2a; color: #aaa; }
.btn.on { background: #f99d25; color: #000; border-color: #f99d25; }

.station-scroll {
    display: flex; gap: 5px; flex-wrap: wrap;
    max-height: 110px; overflow-y: auto; padding: 2px;
}
.sbtn {
    font-family: 'LTAIdentity', sans-serif;
    font-size: 10px; padding: 4px 9px; border-radius: 5px;
    border: 1px solid #2a2a2a; background: #181818; color: #555;
    cursor: pointer; transition: all 0.12s; white-space: nowrap;
}
.sbtn:hover { background: #222; color: #aaa; }
.sbtn.on { background: #f99d25; color: #000; border-color: #f99d25; }
</style>
</head>
<body>

<!-- ═══════ DRMD PANEL ═══════ -->
<div class="drmd-outer">
  <div class="drmd-panel">

    <!-- LED ticker -->
    <div class="led-outer">
      <span class="led-text" id="ledText"></span>
    </div>

    <!-- Main row -->
    <div class="main-row">

      <!-- Left door triangle -->
      <div class="door-zone left">
        <div class="door-tri" id="triLeft"></div>
      </div>

      <!-- Route strip -->
      <div class="route-area">
        <div class="map-capslet">
          <div class="map-capslet-dot">CC</div>
          Circle Line
        </div>
        <div class="legend" id="legend"></div>

        <div class="route-svg-wrap" id="routeWrap">
          <svg id="routeSvg" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>

        <div class="diamond-wrap"><div class="diamond"></div></div>
      </div>

      <!-- Right door triangle -->
      <div class="door-zone right">
        <div class="door-tri" id="triRight"></div>
      </div>

    </div>
  </div>
</div>

<!-- ═══════ CONTROLS ═══════ -->
<div class="controls">
  <div class="ctrl-row">
    <span class="ctrl-lbl">Station</span>
    <div class="station-scroll" id="stationBtns"></div>
  </div>
  <div class="ctrl-row">
    <span class="ctrl-lbl">Direction</span>
    <div class="btn-grp">
      <button class="btn on" id="btnCW"  onclick="setDir('cw')">⟳ Clockwise</button>
      <button class="btn"    id="btnCCW" onclick="setDir('ccw')">⟲ Anticlockwise</button>
    </div>
  </div>
  <div class="ctrl-row">
    <span class="ctrl-lbl">Location</span>
    <div class="btn-grp">
      <button class="btn on" id="btnTrain"   onclick="setLoc('train')">🚇 In-train</button>
      <button class="btn"    id="btnStation" onclick="setLoc('station')">🚉 At station</button>
    </div>
  </div>
  <div class="ctrl-row">
    <span class="ctrl-lbl">Screen text</span>
    <div class="btn-grp" id="textBtns">
      <button class="btn on" data-t="station">Station</button>
      <button class="btn"    data-t="courtesy">Courtesy</button>
      <button class="btn"    data-t="gap">Mind the Gap</button>
      <button class="btn"    data-t="closing">Doors Closing</button>
      <button class="btn"    data-t="terminus">Terminus</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════
// STATION DATA
// ═══════════════════════════════════════
// CCL ordered clockwise: CC1 → CC34, with CC34 looping back to CC4
// ix = interchange lines, door = which side opens
const CCL = [
    {c:'CC1',  n:'Dhoby Ghaut',        ix:['NSL','NEL'], door:'L'},
    {c:'CC2',  n:'Bras Basah',         ix:[],            door:'L'},
    {c:'CC3',  n:'Esplanade',          ix:[],            door:'R'},
    {c:'CC4',  n:'Promenade',          ix:['DTL'],       door:'L'},
    {c:'CC5',  n:'Nicoll Highway',     ix:[],            door:'R'},
    {c:'CC6',  n:'Stadium',            ix:[],            door:'L'},
    {c:'CC7',  n:'Mountbatten',        ix:[],            door:'R'},
    {c:'CC8',  n:'Dakota',             ix:[],            door:'L'},
    {c:'CC9',  n:'Paya Lebar',         ix:['EWL'],       door:'R'},
    {c:'CC10', n:'MacPherson',         ix:['DTL'],       door:'L'},
    {c:'CC11', n:'Tai Seng',           ix:[],            door:'R'},
    {c:'CC12', n:'Bartley',            ix:[],            door:'L'},
    {c:'CC13', n:'Serangoon',          ix:['NEL'],       door:'R'},
    {c:'CC14', n:'Lorong Chuan',       ix:[],            door:'L'},
    {c:'CC15', n:'Bishan',             ix:['NSL'],       door:'R'},
    {c:'CC16', n:'Marymount',          ix:[],            door:'L'},
    {c:'CC17', n:'Caldecott',          ix:['TEL'],       door:'R'},
    {c:'CC19', n:'Botanic Gardens',    ix:['DTL'],       door:'L'},
    {c:'CC20', n:'Farrer Road',        ix:[],            door:'R'},
    {c:'CC21', n:'Holland Village',    ix:[],            door:'L'},
    {c:'CC22', n:'Buona Vista',        ix:['EWL'],       door:'R'},
    {c:'CC23', n:'one-north',          ix:[],            door:'L'},
    {c:'CC24', n:'Kent Ridge',         ix:[],            door:'R'},
    {c:'CC25', n:'Haw Par Villa',      ix:[],            door:'L'},
    {c:'CC26', n:'Pasir Panjang',      ix:[],            door:'R'},
    {c:'CC27', n:'Labrador Park',      ix:[],            door:'L'},
    {c:'CC28', n:'Telok Blangah',      ix:[],            door:'R'},
    {c:'CC29', n:'HarbourFront',       ix:['NEL'],       door:'L'},
    {c:'CC30', n:'Keppel',             ix:[],            door:'R'},
    {c:'CC31', n:'Cantonment',         ix:[],            door:'L'},
    {c:'CC32', n:'Prince Edward Road', ix:[],            door:'R'},
    {c:'CC33', n:'Marina Bay',         ix:['NSL','TEL'], door:'L'},
    {c:'CC34', n:'Bayfront',           ix:['DTL'],       door:'R'},
];

const LINE_COLORS = {
    CCL: '#f99d25',
    NSL: '#e01a22',
    EWL: '#009645',
    NEL: '#8b1693',
    DTL: '#005da9',
    TEL: '#784008',
};

// ═══════════════════════════════════════
// STATE
// ═══════════════════════════════════════
let curIdx   = 0;
let dir      = 'cw';
let loc      = 'train';
let textMode = 'station';
let animPct  = 0;
let lastT    = null;
const TRAVEL = 5000; // ms between stations

function nxtIdx(i, d) {
    // Clockwise: wraps CC34 → CC4 (idx 3), not back to CC1
    if (d === 'cw')  return i === CCL.length - 1 ? 3 : i + 1;
    else             return i === 3 ? CCL.length - 1 : (i - 1 < 0 ? CCL.length - 1 : i - 1);
}
const getCur  = () => CCL[curIdx];
const getNext = () => CCL[nxtIdx(curIdx, dir)];

// ═══════════════════════════════════════
// ROUTE STRIP — SVG layout constants
// ═══════════════════════════════════════
// The strip is drawn in a tall SVG viewBox.
// Y-axis layout (top to bottom):
//   arrow tip   → y=10
//   arrow base  → y=22
//   line centre → y=38
//   dot centre  → y=38
//   label top   → y=50
//   ix dots row → y=52+ (below label for interchange)
const STEP    = 34;   // px between station centres (horizontal)
const PAD     = 20;   // left/right padding
const LINE_Y  = 38;   // vertical centre of the route line
const SVG_H   = 80;   // total SVG height
const DOT_R   = 5;    // normal dot radius
const IX_R    = 3;    // interchange dot radius
const CUR_R   = 7;    // current station dot radius

function svgEl(tag, attrs, txt) {
    const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (const [k,v] of Object.entries(attrs)) el.setAttribute(k, v);
    if (txt !== undefined) el.textContent = txt;
    return el;
}

function buildRouteStrip() {
    const svg   = document.getElementById('routeSvg');
    const wrap  = document.getElementById('routeWrap');
    const wrapW = wrap.clientWidth || 856;

    const n     = CCL.length;
    const totalW = PAD * 2 + (n - 1) * STEP;
    const svgW   = Math.max(totalW, wrapW);

    svg.setAttribute('viewBox', `0 0 ${svgW} ${SVG_H}`);
    svg.setAttribute('width',   svgW);
    svg.setAttribute('height',  SVG_H);
    svg.innerHTML = '';

    const cur  = getCur();
    const next = getNext();
    const ci   = curIdx; // current index in CCL[]

    // ── Horizontal route line ──
    // Draw in two passes: past (dimmed) and future (bright)
    // For cw: stations 0..ci-1 are past, ci..n-1 are future
    // We draw one dim segment from x[0] to x[ci],
    // and one bright from x[ci] to x[n-1]
    const xOf = i => PAD + i * STEP;

    // Past segment (left of current)
    if (ci > 0) {
        svg.appendChild(svgEl('line', {
            x1: xOf(0), y1: LINE_Y,
            x2: xOf(dir === 'cw' ? ci : ci), y2: LINE_Y,
            stroke: LINE_COLORS.CCL, 'stroke-width': '4',
            'stroke-linecap': 'round', opacity: '0.22',
        }));
    }
    // Future segment (right of current including current)
    svg.appendChild(svgEl('line', {
        x1: xOf(dir === 'cw' ? ci : 0), y1: LINE_Y,
        x2: xOf(n - 1),                 y2: LINE_Y,
        stroke: LINE_COLORS.CCL, 'stroke-width': '4',
        'stroke-linecap': 'round', opacity: '1',
    }));

    // ── Stations ──
    CCL.forEach((st, i) => {
        const x      = xOf(i);
        const isCur  = i === ci;
        const isNext = st.c === next.c;
        const isPast = dir === 'cw' ? i < ci : i > ci;
        const hasIx  = st.ix.length > 0;
        const op     = isPast ? 0.25 : 1;

        // Station dot
        const r     = isCur ? CUR_R : hasIx ? DOT_R + 1 : DOT_R;
        const fill  = isCur ? LINE_COLORS.CCL : '#fff';
        const sw    = isCur ? 0 : 1.5;
        const sCol  = LINE_COLORS.CCL;

        svg.appendChild(svgEl('circle', {
            cx: x, cy: LINE_Y, r,
            fill, stroke: sCol, 'stroke-width': sw,
            opacity: op,
        }));

        // Interchange colour blobs below the line
        if (hasIx) {
            const blobY = LINE_Y + r + 4;
            st.ix.forEach((line, ri) => {
                const bx = x + (ri - (st.ix.length - 1) / 2) * 7;
                svg.appendChild(svgEl('rect', {
                    x: bx - 5, y: blobY,
                    width: 10, height: 5,
                    rx: 2,
                    fill: LINE_COLORS[line] || '#888',
                    opacity: op,
                }));
            });
        }

        // Station name label — below line
        const labelY = LINE_Y + r + (hasIx ? 14 : 10);
        svg.appendChild(svgEl('text', {
            x, y: labelY,
            'text-anchor': 'middle',
            'font-family': 'LTAIdentity, sans-serif',
            'font-size': isCur ? '6.5' : isNext ? '6' : '5.5',
            'font-weight': isCur || isNext ? '700' : 'normal',
            fill: isCur ? '#c97200' : isNext ? '#555' : '#666',
            opacity: isPast ? '0.3' : '1',
        }, st.n));

        // Station code — above label for current/next only
        if (isCur || isNext) {
            svg.appendChild(svgEl('text', {
                x, y: labelY + 7,
                'text-anchor': 'middle',
                'font-family': 'LTAIdentity, sans-serif',
                'font-size': '5',
                fill: isCur ? '#c97200' : '#888',
                opacity: '1',
            }, st.c));
        }

        // ▼ Downward arrow above current station
        if (isCur) {
            // Arrow: a downward-pointing triangle above the dot
            const aw = 10, ah = 11;
            const ay = LINE_Y - r - 3; // tip of arrow (bottom point)
            svg.appendChild(svgEl('polygon', {
                points: `${x},${ay} ${x - aw/2},${ay - ah} ${x + aw/2},${ay - ah}`,
                fill: LINE_COLORS.CCL,
                opacity: '1',
            }));
        }
    });

    // ── Pan SVG so current station is always centred in the viewport ──
    const curX   = xOf(ci);
    const offset = Math.max(0, Math.min(curX - wrapW / 2, svgW - wrapW));
    svg.style.transform = `translateX(${-offset}px)`;
}

// ═══════════════════════════════════════
// LED TEXT
// ═══════════════════════════════════════
const LED_TEXTS = {
    station: () => {
        const cur = getCur(), next = getNext();
        return loc === 'station'
            ? `Doors open on the ${cur.door === 'L' ? 'LEFT' : 'RIGHT'}   ·   Next station ${next.n} (${next.c})   ·   `
            : `Next station ${next.n} (${next.c})   ·   Doors will open on the ${next.door === 'L' ? 'LEFT' : 'RIGHT'}   ·   ${dir === 'cw' ? 'Clockwise' : 'Anticlockwise'} service   ·   `;
    },
    courtesy: () => `Please give up your seat to those who need it more — the elderly, pregnant women, and passengers with young children.   ·   请给有需要的乘客让座。   ·   `,
    gap:      () => `Please mind the platform gap.   ·   请注意列车与站台之间的间隙。   ·   Watch your step.   ·   `,
    closing:  () => `Doors closing   ·   Doors closing   ·   请关好门`,
    terminus: () => {
        const next = getNext();
        return `Next station ${next.n}. This train service ends here. Please alight immediately.   ·   下一站 ${next.n}。本次列车服务到站结束，请立即下车。   ·   `;
    },
};

function updateLED() {
    const el = document.getElementById('ledText');
    if (textMode === 'closing') {
        el.textContent = 'Doors closing';
        el.classList.add('static');
        el.style.animation = 'none';
    } else {
        const t = LED_TEXTS[textMode]();
        el.textContent = t + '          ' + t; // gap between loops
        el.classList.remove('static');
        el.style.animation = 'none';
        void el.offsetWidth;
        el.style.animation = '';
    }
}

// ═══════════════════════════════════════
// DOOR INDICATORS
// ═══════════════════════════════════════
function updateDoors() {
    const st       = loc === 'station' ? getCur() : getNext();
    const tL       = document.getElementById('triLeft');
    const tR       = document.getElementById('triRight');
    const atStn    = loc === 'station';
    const isLeft   = st.door === 'L';
    const isRight  = st.door === 'R';
    tL.className = 'door-tri' + (isLeft  ? ' active' : '') + (isLeft  && atStn ? ' blink' : '');
    tR.className = 'door-tri' + (isRight ? ' active' : '') + (isRight && atStn ? ' blink' : '');
}

// ═══════════════════════════════════════
// LEGEND
// ═══════════════════════════════════════
function buildLegend() {
    const el = document.getElementById('legend');
    el.innerHTML = '';
    [
        ['NSL', 'North-South Line'],
        ['EWL', 'East-West Line'],
        ['NEL', 'North East Line'],
        ['CCL', 'Circle Line'],
        ['DTL', 'Downtown Line'],
        ['TEL', 'Thomson-East Coast Line'],
    ].forEach(([code, name]) => {
        const row = document.createElement('div');
        row.className = 'legend-item';
        row.innerHTML = `<div class="legend-line" style="background:${LINE_COLORS[code]}"></div><span>${name}</span>`;
        el.appendChild(row);
    });
}

// ═══════════════════════════════════════
// ANIMATION LOOP
// ═══════════════════════════════════════
function animate(ts) {
    if (!lastT) lastT = ts;
    const dt = ts - lastT;
    lastT = ts;

    if (loc === 'train' && textMode === 'station') {
        animPct += dt / TRAVEL;
        if (animPct >= 1) {
            animPct = 0;
            curIdx  = nxtIdx(curIdx, dir);
            updateDoors();
            updateLED();
            updateStationBtns();
            buildRouteStrip();
        }
    }
    requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

// ═══════════════════════════════════════
// CONTROLS
// ═══════════════════════════════════════
function setDir(d) {
    dir = d; animPct = 0; lastT = null;
    document.getElementById('btnCW').classList.toggle('on',  d === 'cw');
    document.getElementById('btnCCW').classList.toggle('on', d === 'ccw');
    updateDoors(); updateLED(); buildRouteStrip();
}

function setLoc(l) {
    loc = l; animPct = 0; lastT = null;
    document.getElementById('btnTrain').classList.toggle('on',   l === 'train');
    document.getElementById('btnStation').classList.toggle('on', l === 'station');
    updateDoors(); updateLED(); buildRouteStrip();
}

document.getElementById('textBtns').addEventListener('click', e => {
    const btn = e.target.closest('[data-t]');
    if (!btn) return;
    textMode = btn.dataset.t;
    lastT = null;
    document.querySelectorAll('#textBtns .btn').forEach(b => b.classList.toggle('on', b === btn));
    updateLED();
});

function buildStationBtns() {
    const wrap = document.getElementById('stationBtns');
    CCL.forEach((st, i) => {
        const b = document.createElement('button');
        b.className = 'sbtn' + (i === curIdx ? ' on' : '');
        b.textContent = `${st.c} ${st.n}`;
        b.addEventListener('click', () => {
            curIdx = i; animPct = 0; lastT = null;
            updateDoors(); updateLED(); updateStationBtns(); buildRouteStrip();
        });
        wrap.appendChild(b);
    });
}
function updateStationBtns() {
    document.querySelectorAll('#stationBtns .sbtn').forEach((b, i) => {
        b.classList.toggle('on', i === curIdx);
    });
}

// ═══════════════════════════════════════
// INIT
// ═══════════════════════════════════════
buildLegend();
buildStationBtns();
updateDoors();
updateLED();
buildRouteStrip();

// Rebuild on resize so panning recalculates
window.addEventListener('resize', buildRouteStrip);
</script>
</body>
</html>
