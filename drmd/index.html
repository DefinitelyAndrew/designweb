<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRMD – Circle Line C851E</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=VT323&display=swap" rel="stylesheet">
<style>
@font-face {
    font-family: 'LTAIdentity';
    src: url('fonts/LTAIdentity-Medium.woff2') format('woff2'),
         url('fonts/LTAIdentity-Medium.woff') format('woff');
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
    background: #2a2a2a;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 24px 16px;
    font-family: 'Montserrat', sans-serif;
}

/* ═══════════════════════════════
   DISPLAY UNIT WRAPPER
   Mimics the two physical panels mounted above the train door
═══════════════════════════════ */
.display-unit {
    width: 100%;
    max-width: 980px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

/* ═══════════════════════════════
   TOP: LED TICKER STRIP
   Physical outer bezel + black screen with green dot-matrix text
═══════════════════════════════ */
.led-outer {
    background: linear-gradient(145deg, #3a3a3a, #1a1a1a);
    border: 1px solid #555;
    border-radius: 6px;
    padding: 6px 10px;
    box-shadow:
        0 2px 6px rgba(0,0,0,0.6),
        inset 0 1px 0 rgba(255,255,255,0.08);
}

.led-strip {
    background: #020202;
    border: 1px solid #0a0a0a;
    border-radius: 3px;
    height: 44px;
    display: flex;
    align-items: center;
    overflow: hidden;
    box-shadow:
        inset 0 0 12px rgba(0,0,0,0.9),
        inset 0 0 4px rgba(180,220,60,0.04);
    position: relative;
}

/* Dot-matrix scanline overlay */
.led-strip::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
        repeating-linear-gradient(
            0deg,
            transparent,
            transparent 3px,
            rgba(0,0,0,0.18) 3px,
            rgba(0,0,0,0.18) 4px
        ),
        repeating-linear-gradient(
            90deg,
            transparent,
            transparent 3px,
            rgba(0,0,0,0.10) 3px,
            rgba(0,0,0,0.10) 4px
        );
    pointer-events: none;
    z-index: 2;
}

.led-text {
    font-family: 'VT323', monospace;
    font-size: 26px;
    color: #c8e87a;
    white-space: nowrap;
    letter-spacing: 0.08em;
    text-shadow:
        0 0 8px #b8d84a,
        0 0 2px #c8e87a,
        0 0 18px rgba(180, 220, 60, 0.4);
    padding-left: 100%;
    animation: ledScroll 35s linear infinite;
    will-change: transform;
    display: block;
    position: relative;
    z-index: 1;
}

@keyframes ledScroll {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-200%); }
}

.led-text.static {
    padding-left: 0;
    animation: none;
    transform: none;
    width: 100%;
    text-align: center;
    font-size: 26px;
}

/* ═══════════════════════════════
   BOTTOM: MAP PANEL
   Physical outer bezel + white screen with full MRT network
═══════════════════════════════ */
.map-outer {
    background: linear-gradient(145deg, #3a3a3a, #1a1a1a);
    border: 1px solid #555;
    border-radius: 6px;
    padding: 6px 10px;
    box-shadow:
        0 2px 6px rgba(0,0,0,0.6),
        inset 0 1px 0 rgba(255,255,255,0.08);
}

.map-panel {
    background: #eeeee8;
    border: 1px solid #bbb;
    border-radius: 3px;
    position: relative;
    overflow: hidden;
    box-shadow: inset 0 0 8px rgba(0,0,0,0.08);
}

/* Capslet — top left of map panel */
.map-capslet {
    position: absolute;
    top: 5px;
    left: 24px;
    display: inline-flex;
    align-items: center;
    gap: 3px;
    background: #f99d25;
    color: #000;
    font-family: 'LTAIdentity', sans-serif;
    font-size: 7px;
    padding: 2px 6px 2px 3px;
    border-radius: 20px;
    z-index: 10;
    line-height: 1;
}
.map-capslet-dot {
    width: 12px; height: 12px;
    background: #000;
    color: #f99d25;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 5px;
    flex-shrink: 0;
}

/* Green triangle door indicators — left & right */
.door-indicator {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
}
.door-indicator.left  { left: 5px; }
.door-indicator.right { right: 5px; }

.door-tri {
    width: 0; height: 0;
    opacity: 0.12;
    transition: opacity 0.2s;
    filter: drop-shadow(0 0 3px #00cc44);
}
.door-tri.active { opacity: 1; }
.door-tri.blink  { animation: doorBlink 0.7s step-start infinite; }
@keyframes doorBlink { 50% { opacity: 0; } }

/* Left triangle points LEFT (◀) */
.door-indicator.left .door-tri {
    border-top: 13px solid transparent;
    border-bottom: 13px solid transparent;
    border-right: 16px solid #00cc44;
}
/* Right triangle points RIGHT (▶) */
.door-indicator.right .door-tri {
    border-top: 13px solid transparent;
    border-bottom: 13px solid transparent;
    border-left: 16px solid #00cc44;
}

/* Legend top-right */
.legend {
    position: absolute;
    top: 5px;
    right: 24px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    z-index: 5;
}
.legend-item {
    display: flex;
    align-items: center;
    gap: 3px;
    font-family: 'LTAIdentity', sans-serif;
    font-size: 6px;
    color: #333;
}
.legend-line {
    width: 14px;
    height: 3px;
    border-radius: 2px;
    flex-shrink: 0;
}

/* SVG map fills the panel */
#networkSvg {
    display: block;
    width: 100%;
}

/* ═══════════════════════════════
   CONTROLS
═══════════════════════════════ */
.controls {
    width: 100%;
    max-width: 980px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}
.ctrl-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    flex-wrap: wrap;
}
.ctrl-lbl {
    font-size: 10px;
    font-weight: 700;
    color: #666;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    min-width: 110px;
    padding-top: 7px;
    flex-shrink: 0;
}
.btn-grp { display: flex; gap: 6px; flex-wrap: wrap; }
.btn {
    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    font-weight: 600;
    padding: 6px 13px;
    border-radius: 7px;
    border: 1px solid #3a3a3a;
    background: #222;
    color: #666;
    cursor: pointer;
    transition: all 0.12s;
    white-space: nowrap;
}
.btn:hover { background: #2a2a2a; color: #aaa; }
.btn.on { background: #f99d25; color: #000; border-color: #f99d25; }

.station-scroll {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    max-height: 110px;
    overflow-y: auto;
    padding: 2px;
}
.sbtn {
    font-family: 'LTAIdentity', sans-serif;
    font-size: 10px;
    padding: 4px 9px;
    border-radius: 5px;
    border: 1px solid #2a2a2a;
    background: #181818;
    color: #555;
    cursor: pointer;
    transition: all 0.12s;
    white-space: nowrap;
}
.sbtn:hover { background: #222; color: #aaa; }
.sbtn.on { background: #f99d25; color: #000; border-color: #f99d25; }
</style>
</head>

function updateLED() {
    const t   = LED_TEXTS[textMode]();
    const el  = document.getElementById('ledText');
    const txt = t + t; // duplicate for seamless loop

    // For "Doors closing" use static centered text
    if (textMode === 'closing') {
        el.textContent = 'Doors closing';
        el.classList.add('static');
    } else {
        el.textContent = txt;
        el.classList.remove('static');
        el.style.animation = 'none';
        void el.offsetWidth;
        el.style.animation = '';
    }
}

// ─────────────────────────────────────────────────────
// DOOR INDICATORS
// ─────────────────────────────────────────────────────
function updateDoors() {
    const st = loc === 'station' ? getCur() : getNext();
    const tL = document.getElementById('triLeft');
    const tR = document.getElementById('triRight');

    const isLeft  = st.door === 'L';
    const isRight = st.door === 'R';
    const shouldBlink = loc === 'station' && doorsOpen;

    tL.className = 'door-tri' + (isLeft  ? ' active' : '') + (isLeft  && shouldBlink ? ' blink' : '');
    tR.className = 'door-tri' + (isRight ? ' active' : '') + (isRight && shouldBlink ? ' blink' : '');
}

// ─────────────────────────────────────────────────────
// LEGEND
// ─────────────────────────────────────────────────────
function buildLegend() {
    const el = document.getElementById('legend');
    el.innerHTML = '';
    const lines = [
        ['NSL', 'North-South Line'],
        ['EWL', 'East-West Line'],
        ['NEL', 'North East Line'],
        ['CCL', 'Circle Line'],
        ['DTL', 'Downtown Line'],
        ['TEL', 'Thomson-East Coast'],
    ];
    lines.forEach(([code, name]) => {
        const row = document.createElement('div');
        row.className = 'legend-item';
        row.innerHTML = `<div class="legend-line" style="background:${LINE_COLORS[code]}"></div><span>${name}</span>`;
        el.appendChild(row);
    });
}

// ─────────────────────────────────────────────────────
// NETWORK MAP SVG
// ─────────────────────────────────────────────────────
function svgEl(tag, attrs, txt) {
    const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (const [k,v] of Object.entries(attrs)) el.setAttribute(k, v);
    if (txt !== undefined) el.textContent = txt;
    return el;
}

function buildMap() {
    const svg = document.getElementById('networkSvg');
    svg.innerHTML = '';

    // ── Draw other lines first (behind CCL) ──
    function drawLine(nodes, color, strokeW = 2) {
        for (let i = 0; i < nodes.length - 1; i++) {
            const a = nodes[i], b = nodes[i + 1];
            svg.appendChild(svgEl('line', {
                x1: a.x, y1: a.y, x2: b.x, y2: b.y,
                stroke: color, 'stroke-width': strokeW,
                'stroke-linecap': 'round', opacity: '0.55',
            }));
        }
    }

    // Draw background lines
    drawLine(NSL_NODES, LINE_COLORS.NSL, 2.5);
    drawLine(EWL_NODES, LINE_COLORS.EWL, 2.5);
    drawLine(NEL_NODES, LINE_COLORS.NEL, 2.5);
    drawLine(DTL_NODES, LINE_COLORS.DTL, 2);
    drawLine(TEL_NODES, LINE_COLORS.TEL, 2);

    // ── Draw CCL loop ──
    // Build ordered point list: CC1→CC2→…→CC34→back to CC4
    const cclOrder = [...CCL];
    // Draw segments
    const cclPts = cclOrder.map(s => CCL_POS[s.c]);

    for (let i = 0; i < cclPts.length - 1; i++) {
        const a = cclPts[i], b = cclPts[i + 1];
        // Determine if this segment is "passed" (between start and train position)
        const segPassed = isSegmentPassed(i);
        svg.appendChild(svgEl('line', {
            x1: a[0], y1: a[1], x2: b[0], y2: b[1],
            stroke: LINE_COLORS.CCL,
            'stroke-width': '3',
            'stroke-linecap': 'round',
            opacity: segPassed ? '0.3' : '1',
        }));
    }
    // Close loop: CC34 → CC4 (Promenade)
    const cc34 = CCL_POS['CC34'], cc4 = CCL_POS['CC4'];
    svg.appendChild(svgEl('line', {
        x1: cc34[0], y1: cc34[1], x2: cc4[0], y2: cc4[1],
        stroke: LINE_COLORS.CCL, 'stroke-width': '3',
        'stroke-linecap': 'round', opacity: '1',
    }));

    // ── Station dots for other lines ──
    function drawStationDots(nodes, lineColor) {
        nodes.forEach(s => {
            const hasIx = s.ix && s.ix.length > 0;
            svg.appendChild(svgEl('circle', {
                cx: s.x, cy: s.y,
                r: hasIx ? 3.5 : 2,
                fill: '#fff',
                stroke: lineColor, 'stroke-width': '1',
                opacity: '0.7',
            }));
        });
    }
    drawStationDots(NSL_NODES, LINE_COLORS.NSL);
    drawStationDots(EWL_NODES, LINE_COLORS.EWL);
    drawStationDots(NEL_NODES, LINE_COLORS.NEL);
    drawStationDots(DTL_NODES, LINE_COLORS.DTL);
    drawStationDots(TEL_NODES, LINE_COLORS.TEL);

    // ── CCL station dots ──
    const cur  = getCur();
    const next = getNext();
    const curPos  = CCL_POS[cur.c];
    const nextPos = CCL_POS[next.c];

    CCL.forEach((st, i) => {
        const [x, y] = CCL_POS[st.c];
        const isCur  = st.c === cur.c;
        const isNext = st.c === next.c;
        const isPast = isStationPassed(i);
        const hasIx  = st.ix.length > 0;

        // Dot
        const r    = isCur ? 6 : isNext ? 5 : hasIx ? 3.5 : 2.5;
        const fill = isCur ? '#fff' : isNext ? LINE_COLORS.CCL : '#fff';
        const stroke     = isCur ? LINE_COLORS.CCL : isNext ? '#fff' : LINE_COLORS.CCL;
        const strokeW    = isCur ? 2.5 : isNext ? 1.5 : 1;
        const opacity    = isPast && !isCur && !isNext ? '0.35' : '1';

        svg.appendChild(svgEl('circle', {
            cx: x, cy: y, r,
            fill, stroke, 'stroke-width': strokeW, opacity,
        }));

        // Interchange coloured rings
        if (hasIx) {
            st.ix.forEach((line, ri) => {
                svg.appendChild(svgEl('circle', {
                    cx: x + (ri * 6) - (st.ix.length - 1) * 3,
                    cy: y + r + 4,
                    r: 2.5,
                    fill: LINE_COLORS[line] || '#888',
                    stroke: '#f0f0ec', 'stroke-width': '0.5',
                }));
            });
        }

        // Station code label
        const above = y > 100; // label above or below based on position
        const labelY = above ? y - r - 3 : y + r + 8;
        if (isCur || isNext || hasIx) {
            const txt = svgEl('text', {
                x, y: labelY,
                'text-anchor': 'middle',
                'font-family': 'LTAIdentity, sans-serif',
                'font-size': isCur || isNext ? '7' : '5.5',
                fill: isCur ? '#111' : isNext ? '#c97200' : '#444',
                'font-weight': isCur || isNext ? '600' : 'normal',
                opacity: isPast && !isCur && !isNext ? '0.4' : '1',
            }, st.n.length > 12 ? st.c : st.n);
            svg.appendChild(txt);
        }
    });

    // ── Animated train position ──
    // Interpolate between cur and next CCL positions
    const trainX = curPos[0] + (nextPos[0] - curPos[0]) * animPct;
    const trainY = curPos[1] + (nextPos[1] - curPos[1]) * animPct;

    // Train dot (orange circle with white ring)
    svg.appendChild(svgEl('circle', {
        cx: trainX, cy: trainY, r: 5,
        fill: LINE_COLORS.CCL,
        stroke: '#fff', 'stroke-width': '1.5',
    }));
    // Small arrow inside
    const angle = Math.atan2(nextPos[1] - curPos[1], nextPos[0] - curPos[0]);
    const ax = trainX + Math.cos(angle) * 2.5;
    const ay = trainY + Math.sin(angle) * 2.5;
    svg.appendChild(svgEl('circle', { cx: ax, cy: ay, r: 1, fill: '#000' }));
}

// ─────────────────────────────────────────────────────
// HELPERS: passed segments/stations
// ─────────────────────────────────────────────────────
function isStationPassed(i) {
    // A station is "passed" if it's behind the current position in travel dir
    // Simple: just dim everything before curIdx
    if (dir === 'cw') return i < curIdx;
    else              return i > curIdx;
}

function isSegmentPassed(segIdx) {
    if (dir === 'cw') return segIdx < curIdx;
    else              return segIdx > curIdx;
}

// ─────────────────────────────────────────────────────
// ANIMATION
// ─────────────────────────────────────────────────────
function animate(ts) {
    if (!lastT) lastT = ts;
    const dt = ts - lastT;
    lastT = ts;

    if (loc === 'train') {
        animPct += dt / TRAVEL;
        if (animPct >= 1) {
            animPct = 0;
            curIdx  = nxt(curIdx, dir);
            updateUI();
            updateStationBtns();
        }
    }
    buildMap();
    requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

// ─────────────────────────────────────────────────────
// UI UPDATE
// ─────────────────────────────────────────────────────
function updateUI() {
    updateLED();
    updateDoors();
}

// ─────────────────────────────────────────────────────
// CONTROLS
// ─────────────────────────────────────────────────────
function setDir(d) {
    dir = d; animPct = 0; lastT = null;
    document.getElementById('btnCW').classList.toggle('on',  d === 'cw');
    document.getElementById('btnCCW').classList.toggle('on', d === 'ccw');
    updateUI();
}

function setLoc(l) {
    loc = l; animPct = 0; lastT = null;
    document.getElementById('btnTrain').classList.toggle('on',   l === 'train');
    document.getElementById('btnStation').classList.toggle('on', l === 'station');
    doorsOpen = (l === 'station');
    updateUI();
}

document.getElementById('textBtns').addEventListener('click', e => {
    const btn = e.target.closest('[data-t]');
    if (!btn) return;
    textMode = btn.dataset.t;
    document.querySelectorAll('#textBtns .btn').forEach(b => b.classList.toggle('on', b === btn));
    updateUI();
});

function buildStationBtns() {
    const wrap = document.getElementById('stationBtns');
    CCL.forEach((st, i) => {
        const b = document.createElement('button');
        b.className = 'sbtn' + (i === curIdx ? ' on' : '');
        b.textContent = `${st.c} ${st.n}`;
        b.addEventListener('click', () => {
            curIdx = i; animPct = 0; lastT = null;
            updateUI(); updateStationBtns(); buildMap();
        });
        wrap.appendChild(b);
    });
}
function updateStationBtns() {
    document.querySelectorAll('#stationBtns .sbtn').forEach((b, i) => {
        b.classList.toggle('on', i === curIdx);
    });
}

// ─────────────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────────────
buildLegend();
buildStationBtns();
updateUI();
</script>
</body>
</html>
