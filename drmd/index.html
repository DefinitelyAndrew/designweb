<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRMD – Circle Line</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
@font-face {
    font-family: 'LTAIdentity';
    src: url('fonts/LTAIdentity-Medium.woff2') format('woff2'),
         url('fonts/LTAIdentity-Medium.woff') format('woff');
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
    --ccl:    #f99d25;
    --black:  #0a0a0a;
    --dark:   #111;
    --dim:    #222;
    --nsl: #e01a22; --nel: #8b1693; --ewl: #009645;
    --dtl: #005da9; --tel: #784008;
}

body {
    background: #1a1a1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    font-family: 'LTAIdentity', sans-serif;
    gap: 20px;
    padding: 20px;
}

/* ═══════════════════════════════════════
   SCREEN BEZEL
═══════════════════════════════════════ */
.bezel {
    width: 100%;
    max-width: 960px;
    background: #1c1c1c;
    border-radius: 12px;
    padding: 10px;
    box-shadow:
        0 0 0 2px #333,
        0 20px 60px rgba(0,0,0,0.8);
}

/* ═══════════════════════════════════════
   SCREEN ITSELF — 16:4.5 ratio
═══════════════════════════════════════ */
.screen {
    background: var(--black);
    border-radius: 6px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    aspect-ratio: 16 / 4.5;
    position: relative;
}

/* ── Main body (3 columns) ── */
.screen-body {
    display: flex;
    flex: 1;
    min-height: 0;
}

/* ── LEFT panel: current station ── */
.panel-left {
    width: 28%;
    background: var(--black);
    border-right: 1px solid #1e1e1e;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 4% 0 5%;
    position: relative;
    flex-shrink: 0;
}

.label-small {
    font-size: clamp(6px, 1vw, 9px);
    color: #555;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 3px;
}

.cur-name {
    font-size: clamp(13px, 2.2vw, 22px);
    color: #fff;
    line-height: 1.15;
    margin-bottom: 4px;
    word-break: break-word;
}

.cur-code {
    display: inline-block;
    background: var(--ccl);
    color: #000;
    font-size: clamp(8px, 1.1vw, 11px);
    padding: 2px 7px;
    border-radius: 3px;
    margin-bottom: 6px;
    letter-spacing: 0.04em;
}

/* Door indicator */
.door-wrap {
    display: flex;
    align-items: center;
    gap: 5px;
    margin-top: 4px;
}
.door-label {
    font-size: clamp(5px, 0.85vw, 8px);
    color: #444;
    letter-spacing: 0.1em;
    text-transform: uppercase;
}
.door-arrows {
    display: flex;
    gap: 3px;
}
.door-arrow {
    width: clamp(10px, 1.6vw, 16px);
    height: clamp(10px, 1.6vw, 16px);
    display: flex; align-items: center; justify-content: center;
    border-radius: 2px;
    opacity: 0.2;
    transition: opacity 0.2s;
}
.door-arrow.active {
    opacity: 1;
}
.door-arrow svg {
    width: 100%; height: 100%;
}
.door-left svg { fill: #2ecc40; }
.door-right svg { fill: #2ecc40; }

/* Interchange badges on left */
.ix-row {
    display: flex; flex-wrap: wrap; gap: 3px;
    margin-top: 5px;
}
.ix-badge {
    font-size: clamp(5px, 0.75vw, 7px);
    padding: 1px 4px;
    border-radius: 2px;
    color: #fff;
    letter-spacing: 0.04em;
}

/* ── CENTRE panel: route map ── */
.panel-centre {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--black);
    padding: 0 8px;
    overflow: hidden;
    min-width: 0;
}

.map-viewport {
    width: 100%;
    overflow: hidden;
    position: relative;
}

#routeSvg {
    display: block;
    overflow: visible;
}

/* ── RIGHT panel: next station ── */
.panel-right {
    width: 28%;
    background: #060606;
    border-left: 1px solid #1e1e1e;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 4%;
    flex-shrink: 0;
}

.next-label {
    font-size: clamp(6px, 1vw, 9px);
    color: var(--ccl);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 4px;
    opacity: 0.8;
}

.next-name {
    font-size: clamp(13px, 2.2vw, 22px);
    color: var(--ccl);
    line-height: 1.15;
    margin-bottom: 4px;
    word-break: break-word;
}

.next-code {
    display: inline-block;
    background: var(--ccl);
    color: #000;
    font-size: clamp(8px, 1.1vw, 11px);
    padding: 2px 7px;
    border-radius: 3px;
    margin-bottom: 6px;
    letter-spacing: 0.04em;
}

/* Direction badge */
.dir-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 3px;
    padding: 2px 6px;
    margin-top: 4px;
}
.dir-arrow {
    font-size: clamp(7px, 0.9vw, 9px);
    color: var(--ccl);
}
.dir-text {
    font-size: clamp(6px, 0.85vw, 8px);
    color: #888;
    letter-spacing: 0.08em;
    text-transform: uppercase;
}

/* ── BOTTOM ticker ── */
.ticker-bar {
    height: clamp(16px, 2.5vw, 22px);
    background: #0d0d0d;
    border-top: 1px solid #1c1c1c;
    display: flex;
    align-items: center;
    overflow: hidden;
    flex-shrink: 0;
}

.ticker-tag {
    background: var(--ccl);
    color: #000;
    font-size: clamp(6px, 0.9vw, 9px);
    padding: 0 8px;
    height: 100%;
    display: flex; align-items: center;
    letter-spacing: 0.1em;
    white-space: nowrap;
    flex-shrink: 0;
}

.ticker-track {
    flex: 1;
    overflow: hidden;
    height: 100%;
    display: flex; align-items: center;
}

.ticker-inner {
    white-space: nowrap;
    font-size: clamp(6px, 0.9vw, 9px);
    color: rgba(255,255,255,0.7);
    letter-spacing: 0.06em;
    animation: tick 30s linear infinite;
    will-change: transform;
    padding-left: 20px;
}

@keyframes tick {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-50%); }
}

/* ── Blinking dot ── */
.blink { animation: blink 0.9s step-start infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* CCL capslet in centre top */
.map-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 0 2px;
    margin-bottom: 4px;
    flex-shrink: 0;
}
.capslet {
    display: inline-flex; align-items: center; gap: 3px;
    background: var(--ccl);
    color: #000;
    font-size: clamp(6px, 0.9vw, 9px);
    padding: 2px 6px 2px 3px;
    border-radius: 20px;
    line-height: 1;
}
.capslet-dot {
    width: clamp(10px, 1.4vw, 14px);
    height: clamp(10px, 1.4vw, 14px);
    background: #000;
    color: var(--ccl);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(5px, 0.7vw, 7px);
    flex-shrink: 0;
}
.map-clock {
    font-size: clamp(8px, 1.2vw, 12px);
    color: rgba(255,255,255,0.5);
    letter-spacing: 0.08em;
}

/* ══════════════════════════════════════
   CONTROLS (outside screen)
══════════════════════════════════════ */
.controls {
    width: 100%;
    max-width: 960px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.ctrl-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.ctrl-lbl {
    font-family: 'Montserrat', sans-serif;
    font-size: 10px;
    font-weight: 600;
    color: #666;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    min-width: 100px;
    flex-shrink: 0;
}

.btn-grp { display: flex; gap: 5px; flex-wrap: wrap; }

.btn {
    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid #333;
    background: #1a1a1a;
    color: #777;
    cursor: pointer;
    transition: all 0.12s;
    white-space: nowrap;
}
.btn:hover { background: #242424; color: #bbb; }
.btn.on { background: var(--ccl); color: #000; border-color: var(--ccl); }

.station-scroll {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    max-height: 100px;
    overflow-y: auto;
    padding: 2px;
}

.sbtn {
    font-family: 'LTAIdentity', sans-serif;
    font-size: 10px;
    padding: 4px 8px;
    border-radius: 4px;
    border: 1px solid #2a2a2a;
    background: #141414;
    color: #555;
    cursor: pointer;
    transition: all 0.12s;
    white-space: nowrap;
}
.sbtn:hover { background: #1e1e1e; color: #aaa; }
.sbtn.on { background: var(--ccl); color: #000; border-color: var(--ccl); }
</style>
</head>
<body>

<!-- ══ BEZEL + SCREEN ══ -->
<div class="bezel">
  <div class="screen">

    <!-- Body: 3 columns -->
    <div class="screen-body">

      <!-- LEFT: current station -->
      <div class="panel-left" id="panelLeft">
        <div class="label-small" id="leftLabel">CURRENT STATION</div>
        <div class="cur-name" id="curName">Dhoby Ghaut</div>
        <div class="cur-code" id="curCode">CC1</div>
        <div class="ix-row" id="curIx"></div>
        <div class="door-wrap">
          <span class="door-label">DOORS</span>
          <div class="door-arrows">
            <div class="door-arrow door-left" id="doorLeft">
              <svg viewBox="0 0 10 10"><polygon points="8,1 2,5 8,9"/></svg>
            </div>
            <div class="door-arrow door-right" id="doorRight">
              <svg viewBox="0 0 10 10"><polygon points="2,1 8,5 2,9"/></svg>
            </div>
          </div>
        </div>
      </div>

      <!-- CENTRE: route map -->
      <div class="panel-centre">
        <div class="map-header">
          <div class="capslet">
            <div class="capslet-dot">CC</div>
            Circle Line
          </div>
          <div class="map-clock" id="clock">00:00</div>
        </div>
        <div class="map-viewport">
          <svg id="routeSvg" viewBox="0 0 520 60" preserveAspectRatio="xMidYMid meet" style="width:100%;height:100%;"></svg>
        </div>
      </div>

      <!-- RIGHT: next station -->
      <div class="panel-right">
        <div class="next-label">NEXT STATION</div>
        <div class="next-name" id="nextName">Bras Basah</div>
        <div class="next-code" id="nextCode">CC2</div>
        <div class="ix-row" id="nextIx"></div>
        <div class="dir-badge">
          <span class="dir-arrow" id="dirArrow">→</span>
          <span class="dir-text" id="dirText">Clockwise</span>
        </div>
      </div>

    </div><!-- /screen-body -->

    <!-- TICKER -->
    <div class="ticker-bar">
      <div class="ticker-tag">SMRT</div>
      <div class="ticker-track">
        <div class="ticker-inner" id="tickerInner">—</div>
      </div>
    </div>

  </div><!-- /screen -->
</div><!-- /bezel -->

<!-- ══ CONTROLS ══ -->
<div class="controls">

  <div class="ctrl-row">
    <span class="ctrl-lbl">Station</span>
    <div class="station-scroll" id="stationBtns"></div>
  </div>

  <div class="ctrl-row">
    <span class="ctrl-lbl">Direction</span>
    <div class="btn-grp">
      <button class="btn on"  id="btnCW"  onclick="setDir('cw')">⟳ Clockwise</button>
      <button class="btn"     id="btnCCW" onclick="setDir('ccw')">⟲ Anticlockwise</button>
    </div>
  </div>

  <div class="ctrl-row">
    <span class="ctrl-lbl">Location</span>
    <div class="btn-grp">
      <button class="btn on"  id="btnTrain"   onclick="setLoc('train')">🚇 In-train</button>
      <button class="btn"     id="btnStation" onclick="setLoc('station')">🚉 In-station</button>
    </div>
  </div>

  <div class="ctrl-row">
    <span class="ctrl-lbl">Screen text</span>
    <div class="btn-grp" id="textBtns">
      <button class="btn on"  data-t="station">Station</button>
      <button class="btn"     data-t="courtesy">Courtesy</button>
      <button class="btn"     data-t="gap">Mind the Gap</button>
    </div>
  </div>

</div>

<script>
// ─────────────────────────────────────────
// DATA
// ─────────────────────────────────────────
// CCL loop order (clockwise): CC1→CC34 then back to CC4 (Promenade)
// Spur: CC1–CC2–CC3–CC4
// We represent a flat array; navigation wraps CC34→CC4
const S = [
  {c:'CC1',  n:'Dhoby Ghaut',        ix:['NSL','NEL'], door:'L'},
  {c:'CC2',  n:'Bras Basah',         ix:[],            door:'L'},
  {c:'CC3',  n:'Esplanade',          ix:[],            door:'R'},
  {c:'CC4',  n:'Promenade',          ix:['DTL'],       door:'L'},
  {c:'CC5',  n:'Nicoll Highway',     ix:[],            door:'R'},
  {c:'CC6',  n:'Stadium',            ix:[],            door:'L'},
  {c:'CC7',  n:'Mountbatten',        ix:[],            door:'R'},
  {c:'CC8',  n:'Dakota',             ix:[],            door:'L'},
  {c:'CC9',  n:'Paya Lebar',         ix:['EWL'],       door:'R'},
  {c:'CC10', n:'MacPherson',         ix:['DTL'],       door:'L'},
  {c:'CC11', n:'Tai Seng',           ix:[],            door:'R'},
  {c:'CC12', n:'Bartley',            ix:[],            door:'L'},
  {c:'CC13', n:'Serangoon',          ix:['NEL'],       door:'R'},
  {c:'CC14', n:'Lorong Chuan',       ix:[],            door:'L'},
  {c:'CC15', n:'Bishan',             ix:['NSL'],       door:'R'},
  {c:'CC16', n:'Marymount',          ix:[],            door:'L'},
  {c:'CC17', n:'Caldecott',          ix:['TEL'],       door:'R'},
  {c:'CC19', n:'Botanic Gardens',    ix:['DTL'],       door:'L'},
  {c:'CC20', n:'Farrer Road',        ix:[],            door:'R'},
  {c:'CC21', n:'Holland Village',    ix:[],            door:'L'},
  {c:'CC22', n:'Buona Vista',        ix:['EWL'],       door:'R'},
  {c:'CC23', n:'one-north',          ix:[],            door:'L'},
  {c:'CC24', n:'Kent Ridge',         ix:[],            door:'R'},
  {c:'CC25', n:'Haw Par Villa',      ix:[],            door:'L'},
  {c:'CC26', n:'Pasir Panjang',      ix:[],            door:'R'},
  {c:'CC27', n:'Labrador Park',      ix:[],            door:'L'},
  {c:'CC28', n:'Telok Blangah',      ix:[],            door:'R'},
  {c:'CC29', n:'HarbourFront',       ix:['NEL'],       door:'L'},
  {c:'CC30', n:'Keppel',             ix:[],            door:'R'},
  {c:'CC31', n:'Cantonment',         ix:[],            door:'L'},
  {c:'CC32', n:'Prince Edward Road', ix:[],            door:'R'},
  {c:'CC33', n:'Marina Bay',         ix:['NSL','TEL'], door:'L'},
  {c:'CC34', n:'Bayfront',           ix:['DTL'],       door:'R'},
];

const IX_COL = {NSL:'#e01a22',NEL:'#8b1693',EWL:'#009645',DTL:'#005da9',TEL:'#784008'};

// ─────────────────────────────────────────
// STATE
// ─────────────────────────────────────────
let curIdx    = 0;
let dir       = 'cw';
let loc       = 'train';   // 'train' | 'station'
let textMode  = 'station';
let animPct   = 0;         // 0..1 progress cur→next
let lastT     = null;
const TRAVEL  = 4500;      // ms per segment
const VISIBLE = 11;        // stations visible at once (5 behind, cur, 5 ahead)
const BEHIND  = 5;

// ─────────────────────────────────────────
// NAVIGATION
// ─────────────────────────────────────────
function nxt(i, d) {
    // CW: after CC34(idx 32) → CC4(idx 3)
    // CCW: before CC4(idx 3) → CC34(idx 32)
    if (d === 'cw') {
        if (i === S.length - 1) return 3; // CC34 → CC4 (Promenade)
        return (i + 1) % S.length;
    } else {
        if (i === 3) return S.length - 1; // CC4 → CC34
        return (i - 1 + S.length) % S.length;
    }
}
function prev(i, d) { return nxt(i, d === 'cw' ? 'ccw' : 'cw'); }
function getNext() { return S[nxt(curIdx, dir)]; }
function getCur()  { return S[curIdx]; }

// ─────────────────────────────────────────
// CLOCK
// ─────────────────────────────────────────
function tickClock() {
    const n = new Date();
    document.getElementById('clock').textContent =
        n.getHours().toString().padStart(2,'0') + ':' +
        n.getMinutes().toString().padStart(2,'0');
}
tickClock();
setInterval(tickClock, 10000);

// ─────────────────────────────────────────
// UI UPDATE
// ─────────────────────────────────────────
function updateUI() {
    const cur  = getCur();
    const next = getNext();
    const isStation = loc === 'station';

    // LEFT: current station (or "THIS STATION" when in-station)
    document.getElementById('leftLabel').textContent = isStation ? 'THIS STATION' : 'CURRENT STATION';
    document.getElementById('curName').textContent   = cur.n;
    document.getElementById('curCode').textContent   = cur.c;
    renderIx('curIx', cur.ix);

    // Door indicator
    const dl = document.getElementById('doorLeft');
    const dr = document.getElementById('doorRight');
    if (isStation) {
        // In-station: show door side with blink
        dl.classList.toggle('active', cur.door === 'L');
        dr.classList.toggle('active', cur.door === 'R');
        dl.classList.toggle('blink',  cur.door === 'L');
        dr.classList.toggle('blink',  cur.door === 'R');
    } else {
        // In-train travelling: show upcoming door side
        dl.classList.toggle('active', next.door === 'L');
        dr.classList.toggle('active', next.door === 'R');
        dl.classList.toggle('blink',  next.door === 'L');
        dr.classList.toggle('blink',  next.door === 'R');
    }

    // RIGHT: next station
    document.getElementById('nextName').textContent = isStation ? next.n : next.n;
    document.getElementById('nextCode').textContent = next.c;
    renderIx('nextIx', next.ix);

    // Direction
    document.getElementById('dirArrow').textContent = dir === 'cw' ? '→' : '←';
    document.getElementById('dirText').textContent  = dir === 'cw' ? 'Clockwise' : 'Anticlockwise';

    // Ticker
    updateTicker();
}

function renderIx(elId, ixArr) {
    const el = document.getElementById(elId);
    el.innerHTML = '';
    ixArr.forEach(l => {
        const b = document.createElement('span');
        b.className = 'ix-badge';
        b.style.background = IX_COL[l] || '#555';
        b.textContent = l;
        el.appendChild(b);
    });
}

// ─────────────────────────────────────────
// TICKER
// ─────────────────────────────────────────
const TICKERS = {
    station: () => {
        const cur = getCur(), next = getNext();
        const d   = dir === 'cw' ? 'Clockwise' : 'Anticlockwise';
        return loc === 'station'
            ? `You are now at ${cur.n} (${cur.c}).  Doors open on the ${cur.door === 'L' ? 'LEFT' : 'RIGHT'}.  Next station: ${next.n} (${next.c}).  This is a ${d} Circle Line service.  `
            : `The next station is ${next.n} (${next.c}).  Doors will open on the ${next.door === 'L' ? 'LEFT' : 'RIGHT'}.  This is a ${d} Circle Line service.  `;
    },
    courtesy: () =>
        `Please give up your seat to those who need it more — the elderly, pregnant women, people with disabilities, and passengers with young children.  ` +
        `请给老人、孕妇、残障人士及带小孩的乘客让座。谢谢。  ` +
        `பெரியவர்கள், கர்ப்பிணிகள், மற்றும் குழந்தைகளுடன் இருப்பவர்களுக்கு இடம் கொடுங்கள்.  `,
    gap: () =>
        `Please mind the gap between the train and the platform edge.  请注意列车与月台之间的空隙。  பயணிகள், ரயிலுக்கும் மேடைக்கும் இடையே உள்ள இடைவெளியில் கவனமாக இருங்கள்.  `,
};

function updateTicker() {
    const t = TICKERS[textMode]();
    const full = t + t; // double for seamless loop
    document.getElementById('tickerInner').textContent = full;
    const el = document.getElementById('tickerInner');
    el.style.animation = 'none';
    void el.offsetWidth;
    el.style.animation = '';
}

// ─────────────────────────────────────────
// SVG ROUTE MAP
// ─────────────────────────────────────────
const SVG_W  = 520;
const SVG_H  = 60;
const LINE_Y = 30;
const STEP   = SVG_W / (VISIBLE + 1);  // spacing between dots
const START  = STEP;
const DOT_R  = 4.5;
const CCL_COL = '#f99d25';

function svgEl(tag, attrs) {
    const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (const [k,v] of Object.entries(attrs)) el.setAttribute(k, v);
    return el;
}

function buildMap() {
    const svg = document.getElementById('routeSvg');
    svg.innerHTML = '';

    // Build window of VISIBLE stations centred on current
    const window_ = [];
    let tmp = curIdx;
    for (let i = 0; i < BEHIND; i++) tmp = prev(tmp, dir);
    for (let i = 0; i < VISIBLE; i++) {
        window_.push(tmp);
        tmp = nxt(tmp, dir);
    }
    // curIdx is at position BEHIND in window_

    const positions = window_.map((si, i) => ({
        x: START + i * STEP,
        y: LINE_Y,
        si, st: S[si],
        isCur:  i === BEHIND,
        isPast: i < BEHIND,
        isNext: i === BEHIND + 1,
    }));

    // ── Track lines ──
    // Full dim track first
    for (let i = 0; i < positions.length - 1; i++) {
        const a = positions[i], b = positions[i+1];
        svg.appendChild(svgEl('line', {
            x1:a.x, y1:LINE_Y, x2:b.x, y2:LINE_Y,
            stroke:'#222', 'stroke-width':'3', 'stroke-linecap':'round'
        }));
    }

    // Train x position
    const curPos  = positions[BEHIND];
    const nextPos = positions[BEHIND + 1];
    const trainX  = curPos.x + (nextPos.x - curPos.x) * animPct;

    // Lit track: past segments + current segment up to train
    for (let i = 0; i < positions.length - 1; i++) {
        const a = positions[i], b = positions[i+1];
        if (i > BEHIND) continue; // only behind and current seg
        const x2 = (i === BEHIND) ? trainX : b.x;
        svg.appendChild(svgEl('line', {
            x1:a.x, y1:LINE_Y, x2, y2:LINE_Y,
            stroke: i < BEHIND ? '#333' : CCL_COL,
            'stroke-width':'3', 'stroke-linecap':'round',
            opacity: i < BEHIND ? '0.5' : '1',
        }));
    }

    // ── Dots + labels ──
    positions.forEach(p => {
        const {x, y, st, isCur, isPast, isNext} = p;

        // Halo on next
        if (isNext) {
            svg.appendChild(svgEl('circle', {
                cx:x, cy:y, r: DOT_R + 5,
                fill:'rgba(249,157,37,0.1)'
            }));
        }

        // Dot
        const dotR  = isCur ? DOT_R + 2.5 : isNext ? DOT_R + 1 : DOT_R;
        const dotFill = isCur  ? '#fff'
                      : isNext ? CCL_COL
                      : isPast ? '#2a2a2a'
                      :          '#3a3a3a';
        const dotStroke = isCur ? CCL_COL : isNext ? '#fff' : 'none';
        svg.appendChild(svgEl('circle', {
            cx:x, cy:y, r:dotR,
            fill:dotFill,
            stroke:dotStroke, 'stroke-width':'1.5'
        }));

        // Interchange colour dots (stacked below main dot)
        st.ix.forEach((line, ri) => {
            svg.appendChild(svgEl('circle', {
                cx: x + (ri * 8) - (st.ix.length - 1) * 4,
                cy: y + DOT_R + 5,
                r: 3,
                fill: IX_COL[line] || '#555',
                stroke:'#0a0a0a', 'stroke-width':'1'
            }));
        });

        // Code above dot
        const codeEl = svgEl('text', {
            x, y: y - DOT_R - 4,
            'text-anchor':'middle',
            'font-family':'LTAIdentity, sans-serif',
            'font-size': isCur || isNext ? '6.5' : '5.5',
            fill: isCur ? '#fff' : isNext ? CCL_COL : isPast ? '#333' : '#555',
        });
        codeEl.textContent = st.c;
        svg.appendChild(codeEl);

        // Station name below dot (split long names)
        const nameY   = y + DOT_R + 14;
        const nameFill = isCur ? '#fff' : isNext ? CCL_COL : isPast ? '#282828' : '#444';
        const nameSz   = isCur || isNext ? '6' : '5';
        const words    = st.n.split(' ');
        if (words.length <= 2) {
            const el = svgEl('text', {
                x, y: nameY,
                'text-anchor':'middle',
                'font-family':'LTAIdentity, sans-serif',
                'font-size': nameSz,
                fill: nameFill,
            });
            el.textContent = st.n;
            svg.appendChild(el);
        } else {
            // Split into 2 lines
            const mid = Math.ceil(words.length / 2);
            [[words.slice(0, mid).join(' '), 0], [words.slice(mid).join(' '), 7]].forEach(([txt, dy]) => {
                const el = svgEl('text', {
                    x, y: nameY + dy,
                    'text-anchor':'middle',
                    'font-family':'LTAIdentity, sans-serif',
                    'font-size': nameSz,
                    fill: nameFill,
                });
                el.textContent = txt;
                svg.appendChild(el);
            });
        }
    });

    // ── Train icon ──
    // Simple orange rectangle with a "window"
    const tw = 18, th = 10;
    svg.appendChild(svgEl('rect', {
        x: trainX - tw/2, y: LINE_Y - th/2,
        width: tw, height: th, rx:'2',
        fill: CCL_COL,
    }));
    svg.appendChild(svgEl('rect', {
        x: trainX - tw/2 + 3, y: LINE_Y - th/2 + 2,
        width: tw - 6, height: th - 4, rx:'1',
        fill:'rgba(0,0,0,0.45)',
    }));
    // Direction arrow on train
    const arrowTxt = svgEl('text', {
        x: trainX, y: LINE_Y + 1.5,
        'text-anchor':'middle',
        'dominant-baseline':'middle',
        'font-size':'4.5',
        fill:'rgba(255,255,255,0.7)',
        'font-family':'sans-serif',
    });
    arrowTxt.textContent = dir === 'cw' ? '▶' : '◀';
    svg.appendChild(arrowTxt);
}

// ─────────────────────────────────────────
// ANIMATION
// ─────────────────────────────────────────
function animate(ts) {
    if (!lastT) lastT = ts;
    const dt = ts - lastT;
    lastT = ts;

    if (loc === 'train') {
        animPct += dt / TRAVEL;
        if (animPct >= 1) {
            animPct = 0;
            curIdx = nxt(curIdx, dir);
            updateUI();
            updateStationBtns();
        }
    }

    buildMap();
    requestAnimationFrame(animate);
}

requestAnimationFrame(animate);

// ─────────────────────────────────────────
// CONTROLS
// ─────────────────────────────────────────
function setDir(d) {
    dir = d;
    lastT = null; animPct = 0;
    document.getElementById('btnCW').classList.toggle('on', d === 'cw');
    document.getElementById('btnCCW').classList.toggle('on', d === 'ccw');
    updateUI();
}

function setLoc(l) {
    loc = l;
    animPct = 0; lastT = null;
    document.getElementById('btnTrain').classList.toggle('on',   l === 'train');
    document.getElementById('btnStation').classList.toggle('on', l === 'station');
    updateUI();
}

document.getElementById('textBtns').addEventListener('click', e => {
    const btn = e.target.closest('[data-t]');
    if (!btn) return;
    textMode = btn.dataset.t;
    document.querySelectorAll('#textBtns .btn').forEach(b => b.classList.toggle('on', b === btn));
    updateTicker();
});

function buildStationBtns() {
    const wrap = document.getElementById('stationBtns');
    wrap.innerHTML = '';
    S.forEach((st, i) => {
        const b = document.createElement('button');
        b.className = 'sbtn' + (i === curIdx ? ' on' : '');
        b.textContent = `${st.c} ${st.n}`;
        b.dataset.i = i;
        b.addEventListener('click', () => {
            curIdx = i; animPct = 0; lastT = null;
            updateUI();
            updateStationBtns();
        });
        wrap.appendChild(b);
    });
}

function updateStationBtns() {
    document.querySelectorAll('#stationBtns .sbtn').forEach((b, i) => {
        b.classList.toggle('on', i === curIdx);
    });
}

// ─────────────────────────────────────────
// INIT
// ─────────────────────────────────────────
buildStationBtns();
updateUI();
</script>
</body>
</html>
