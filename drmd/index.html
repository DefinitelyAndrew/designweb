<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRMD – Circle Line C851E</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=VT323&display=swap" rel="stylesheet">
<style>
@font-face {
    font-family: 'LTAIdentity';
    src: url('fonts/LTAIdentity-Medium.woff2') format('woff2'),
         url('fonts/LTAIdentity-Medium.woff') format('woff');
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
    background: #1e1e1e;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 20px 16px;
    font-family: 'Montserrat', sans-serif;
}

/* ── Metallic bezel ── */
.drmd-outer {
    width: 100%;
    max-width: 980px;
    background: linear-gradient(180deg, #c8caca 0%, #9fa3a3 40%, #b0b4b4 100%);
    border-radius: 10px;
    padding: 5px;
    box-shadow:
        0 4px 18px rgba(0,0,0,0.55),
        inset 0 1px 0 rgba(255,255,255,0.25),
        inset 0 -1px 0 rgba(0,0,0,0.3);
}

/* ── White display panel ── */
.drmd-panel {
    background: #edeeed;
    border-radius: 6px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.10);
    position: relative;
}

/* ── LED ticker ── */
.led-outer {
    background-color: #050505;
    background-image:
        repeating-linear-gradient(0deg,  transparent, transparent 3px, rgba(0,0,0,0.22) 3px, rgba(0,0,0,0.22) 4px),
        repeating-linear-gradient(90deg, transparent, transparent 3px, rgba(0,0,0,0.10) 3px, rgba(0,0,0,0.10) 4px);
    height: 34px;
    display: flex;
    align-items: center;
    overflow: hidden;
    border-bottom: 1px solid #000;
}
.led-text {
    font-family: 'VT323', monospace;
    font-size: 23px;
    color: #c8e87a;
    white-space: nowrap;
    letter-spacing: 0.06em;
    line-height: 1;
    text-shadow: 0 0 8px #b0d040, 0 0 2px #c8e87a;
    display: block;
    position: relative;
    z-index: 1;
    padding-left: 100%;
    animation: ledScroll 32s linear infinite;
    will-change: transform;
}
.led-text.static {
    padding-left: 0;
    animation: none;
    width: 100%;
    text-align: center;
}
@keyframes ledScroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-100%); }
}

/* ── Map row: left zone + map + right zone ── */
.map-row {
    display: flex;
    align-items: stretch;
}

/* ── Left / Right edge zones ──
   Contains: large downward triangle + small direction arrow */
.edge-zone {
    flex-shrink: 0;
    width: 70px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 6px 4px;
}

/* Big downward-pointing ▼ door triangle */
.door-tri {
    width: 0; height: 0;
    border-left:  26px solid transparent;
    border-right: 26px solid transparent;
    border-top:   34px solid #39e030;
    opacity: 0.08;
    transition: opacity 0.15s, filter 0.15s;
    filter: drop-shadow(0 0 0px #39e030);
}
.door-tri.active {
    opacity: 1;
    filter: drop-shadow(0 0 8px #39e030) drop-shadow(0 0 18px rgba(57,224,48,0.5));
}
.door-tri.blink { animation: doorBlink 0.65s step-start infinite; }
@keyframes doorBlink { 50% { opacity: 0; } }

/* Small direction arrow below the triangle */
.dir-arrow {
    font-size: 14px;
    font-weight: 700;
    color: #555;
    line-height: 1;
    font-family: 'LTAIdentity', sans-serif;
}

/* ── Centre map area ── */
.map-area {
    flex: 1;
    position: relative;
    overflow: hidden;
}

/* Capslet top-left */
.map-capslet {
    position: absolute;
    top: 4px; left: 2px;
    display: inline-flex;
    align-items: center;
    gap: 3px;
    background: #f99d25;
    color: #000;
    font-family: 'LTAIdentity', sans-serif;
    font-size: 7px;
    padding: 2px 6px 2px 3px;
    border-radius: 20px;
    z-index: 10;
    line-height: 1;
}
.map-capslet-dot {
    width: 13px; height: 13px;
    background: #000; color: #f99d25;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 5.5px; font-weight: 700;
    font-family: 'LTAIdentity', sans-serif;
    flex-shrink: 0;
}

/* Legend top-right */
.legend {
    position: absolute;
    top: 4px; right: 2px;
    display: flex;
    flex-direction: column;
    gap: 1.5px;
    z-index: 5;
}
.legend-item {
    display: flex; align-items: center; gap: 3px;
    font-family: 'LTAIdentity', sans-serif;
    font-size: 5.5px; color: #333; line-height: 1.2;
}
.legend-line { width: 12px; height: 3px; border-radius: 1.5px; flex-shrink: 0; }

/* SVG map fills the area */
#mapSvg { display: block; width: 100%; }

/* ── Controls ── */
.controls {
    width: 100%; max-width: 980px;
    display: flex; flex-direction: column; gap: 10px;
}
.ctrl-row { display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
.ctrl-lbl {
    font-size: 10px; font-weight: 700; color: #555;
    letter-spacing: 0.1em; text-transform: uppercase;
    min-width: 110px; padding-top: 7px; flex-shrink: 0;
}
.btn-grp { display: flex; gap: 6px; flex-wrap: wrap; }
.btn {
    font-family: 'Montserrat', sans-serif;
    font-size: 11px; font-weight: 600;
    padding: 6px 13px; border-radius: 7px;
    border: 1px solid #3a3a3a; background: #222; color: #666;
    cursor: pointer; transition: all 0.12s; white-space: nowrap;
}
.btn:hover { background: #2a2a2a; color: #aaa; }
.btn.on { background: #f99d25; color: #000; border-color: #f99d25; }
.station-scroll {
    display: flex; gap: 5px; flex-wrap: wrap;
    max-height: 110px; overflow-y: auto; padding: 2px;
}
.sbtn {
    font-family: 'LTAIdentity', sans-serif;
    font-size: 10px; padding: 4px 9px; border-radius: 5px;
    border: 1px solid #2a2a2a; background: #181818; color: #555;
    cursor: pointer; transition: all 0.12s; white-space: nowrap;
}
.sbtn:hover { background: #222; color: #aaa; }
.sbtn.on { background: #f99d25; color: #000; border-color: #f99d25; }
</style>
</head>
<body>

<div class="drmd-outer">
  <div class="drmd-panel">

    <!-- LED ticker -->
    <div class="led-outer">
      <span class="led-text" id="ledText"></span>
    </div>

    <!-- Map row -->
    <div class="map-row">

      <!-- Left edge: door tri (▼) + direction arrow -->
      <div class="edge-zone" id="edgeLeft">
        <div class="door-tri" id="triLeft"></div>
        <div class="dir-arrow" id="arrowLeft"></div>
      </div>

      <!-- CCL loop map -->
      <div class="map-area">
        <div class="map-capslet">
          <div class="map-capslet-dot">CC</div>
          Circle Line
        </div>
        <div class="legend" id="legend"></div>
        <svg id="mapSvg" viewBox="0 0 800 195" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>

      <!-- Right edge: door tri (▼) + direction arrow -->
      <div class="edge-zone" id="edgeRight">
        <div class="door-tri" id="triRight"></div>
        <div class="dir-arrow" id="arrowRight"></div>
      </div>

    </div>
  </div>
</div>

<!-- Controls -->
<div class="controls">
  <div class="ctrl-row">
    <span class="ctrl-lbl">Station</span>
    <div class="station-scroll" id="stationBtns"></div>
  </div>
  <div class="ctrl-row">
    <span class="ctrl-lbl">Direction</span>
    <div class="btn-grp">
      <button class="btn on" id="btnCW"  onclick="setDir('cw')">⟳ Clockwise</button>
      <button class="btn"    id="btnCCW" onclick="setDir('ccw')">⟲ Anticlockwise</button>
    </div>
  </div>
  <div class="ctrl-row">
    <span class="ctrl-lbl">Location</span>
    <div class="btn-grp">
      <button class="btn on" id="btnTrain"   onclick="setLoc('train')">🚇 In-train</button>
      <button class="btn"    id="btnStation" onclick="setLoc('station')">🚉 At station</button>
    </div>
  </div>
  <div class="ctrl-row">
    <span class="ctrl-lbl">Screen text</span>
    <div class="btn-grp" id="textBtns">
      <button class="btn on" data-t="station">Station</button>
      <button class="btn"    data-t="courtesy">Courtesy</button>
      <button class="btn"    data-t="gap">Mind the Gap</button>
      <button class="btn"    data-t="closing">Doors Closing</button>
      <button class="btn"    data-t="terminus">Terminus</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════
// STATIONS (CCL clockwise order, CC18 doesn't exist)
// ═══════════════════════════
const CCL = [
    {c:'CC1',  n:'Dhoby Ghaut',        ix:['NSL','NEL'], door:'L'},
    {c:'CC2',  n:'Bras Basah',         ix:[],            door:'L'},
    {c:'CC3',  n:'Esplanade',          ix:[],            door:'R'},
    {c:'CC4',  n:'Promenade',          ix:['DTL'],       door:'L'},
    {c:'CC5',  n:'Nicoll Highway',     ix:[],            door:'R'},
    {c:'CC6',  n:'Stadium',            ix:[],            door:'L'},
    {c:'CC7',  n:'Mountbatten',        ix:[],            door:'R'},
    {c:'CC8',  n:'Dakota',             ix:[],            door:'L'},
    {c:'CC9',  n:'Paya Lebar',         ix:['EWL'],       door:'R'},
    {c:'CC10', n:'MacPherson',         ix:['DTL'],       door:'L'},
    {c:'CC11', n:'Tai Seng',           ix:[],            door:'R'},
    {c:'CC12', n:'Bartley',            ix:[],            door:'L'},
    {c:'CC13', n:'Serangoon',          ix:['NEL'],       door:'R'},
    {c:'CC14', n:'Lorong Chuan',       ix:[],            door:'L'},
    {c:'CC15', n:'Bishan',             ix:['NSL'],       door:'R'},
    {c:'CC16', n:'Marymount',          ix:[],            door:'L'},
    {c:'CC17', n:'Caldecott',          ix:['TEL'],       door:'R'},
    {c:'CC19', n:'Botanic Gardens',    ix:['DTL'],       door:'L'},
    {c:'CC20', n:'Farrer Road',        ix:[],            door:'R'},
    {c:'CC21', n:'Holland Village',    ix:[],            door:'L'},
    {c:'CC22', n:'Buona Vista',        ix:['EWL'],       door:'R'},
    {c:'CC23', n:'one-north',          ix:[],            door:'L'},
    {c:'CC24', n:'Kent Ridge',         ix:[],            door:'R'},
    {c:'CC25', n:'Haw Par Villa',      ix:[],            door:'L'},
    {c:'CC26', n:'Pasir Panjang',      ix:[],            door:'R'},
    {c:'CC27', n:'Labrador Park',      ix:[],            door:'L'},
    {c:'CC28', n:'Telok Blangah',      ix:[],            door:'R'},
    {c:'CC29', n:'HarbourFront',       ix:['NEL'],       door:'L'},
    {c:'CC30', n:'Keppel',             ix:[],            door:'R'},
    {c:'CC31', n:'Cantonment',         ix:[],            door:'L'},
    {c:'CC32', n:'Prince Edward Road', ix:[],            door:'R'},
    {c:'CC33', n:'Marina Bay',         ix:['NSL','TEL'], door:'L'},
    {c:'CC34', n:'Bayfront',           ix:['DTL'],       door:'R'},
];

const LINE_COLORS = {
    CCL: '#f99d25',
    NSL: '#e01a22',
    EWL: '#009645',
    NEL: '#8b1693',
    DTL: '#005da9',
    TEL: '#784008',
};

// ═══════════════════════════
// CCL LOOP POSITIONS
// viewBox 0 0 800 195
// The loop is an oval — top-right arc (CC1→CC17),
// bottom arc (CC19→CC29), then right-side spur back up (CC30→CC34→CC4)
// ═══════════════════════════
const CCL_POS = {
    // Top arc: CC1 (left-centre) clockwise around the top to CC17
    CC1:  [190, 100],
    CC2:  [218, 116],
    CC3:  [244, 130],
    CC4:  [268, 118],
    CC5:  [291, 106],
    CC6:  [314, 116],
    CC7:  [330, 130],
    CC8:  [344, 145],
    CC9:  [355, 160],
    CC10: [358, 175],
    CC11: [352, 186],
    CC12: [338, 191],
    CC13: [320, 189],
    CC14: [302, 183],
    CC15: [282, 175],
    CC16: [264, 163],
    CC17: [248, 152],
    // Skip CC18 (doesn't exist)
    CC19: [220, 148],
    CC20: [198, 148],
    CC21: [176, 151],
    CC22: [156, 146],
    CC23: [138, 136],
    CC24: [124, 122],
    CC25: [113, 108],
    CC26: [108,  93],
    CC27: [110,  78],
    CC28: [120,  65],
    CC29: [136,  54],
    // Spur: CC30→CC34 curving back up to close at CC4
    CC30: [162,  48],
    CC31: [188,  48],
    CC32: [212,  50],
    CC33: [232,  57],
    CC34: [252,  68],
};

// ═══════════════════════════
// STATE
// ═══════════════════════════
let curIdx   = 0;
let dir      = 'cw';
let loc      = 'train';
let textMode = 'station';
let lastT    = null;
const TRAVEL = 5000;

function nxtIdx(i, d) {
    if (d === 'cw')  return i === CCL.length - 1 ? 3 : i + 1; // CC34 → CC4
    else             return i === 3 ? CCL.length - 1 : (i - 1 < 0 ? CCL.length - 1 : i - 1);
}
const getCur  = () => CCL[curIdx];
const getNext = () => CCL[nxtIdx(curIdx, dir)];

// ═══════════════════════════
// SVG HELPER
// ═══════════════════════════
function svgEl(tag, attrs, txt) {
    const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
    if (txt !== undefined) el.textContent = txt;
    return el;
}

// ═══════════════════════════
// MAP
// ═══════════════════════════
function buildMap() {
    const svg = document.getElementById('mapSvg');
    svg.innerHTML = '';

    const cur  = getCur();
    const next = getNext();

    // ── Draw CCL loop segments ──
    // Clockwise order: CC1→CC2→...→CC34, then CC34→CC4 closes the loop
    const pts = CCL.map(s => CCL_POS[s.c]);

    for (let i = 0; i < pts.length - 1; i++) {
        const [ax, ay] = pts[i];
        const [bx, by] = pts[i + 1];
        const isPast = dir === 'cw' ? i < curIdx : i > curIdx;
        svg.appendChild(svgEl('line', {
            x1: ax, y1: ay, x2: bx, y2: by,
            stroke: LINE_COLORS.CCL, 'stroke-width': '3.5',
            'stroke-linecap': 'round',
            opacity: isPast ? '0.22' : '1',
        }));
    }
    // Close loop: CC34 → CC4
    {
        const [ax, ay] = CCL_POS['CC34'];
        const [bx, by] = CCL_POS['CC4'];
        svg.appendChild(svgEl('line', {
            x1: ax, y1: ay, x2: bx, y2: by,
            stroke: LINE_COLORS.CCL, 'stroke-width': '3.5',
            'stroke-linecap': 'round', opacity: '1',
        }));
    }

    // ── Station dots + labels ──
    CCL.forEach((st, i) => {
        const [x, y] = CCL_POS[st.c];
        const isCur  = i === curIdx;
        const isNext = st.c === next.c;
        const isPast = dir === 'cw' ? i < curIdx : i > curIdx;
        const hasIx  = st.ix.length > 0;
        const op     = isPast && !isCur && !isNext ? '0.25' : '1';

        // Dot
        const r    = isCur ? 7 : hasIx ? 5 : 3.5;
        const fill = isCur ? LINE_COLORS.CCL : '#fff';
        const sw   = isCur ? 0 : 1.5;
        svg.appendChild(svgEl('circle', {
            cx: x, cy: y, r,
            fill, stroke: LINE_COLORS.CCL, 'stroke-width': sw, opacity: op,
        }));

        // Interchange colour dots
        if (hasIx) {
            st.ix.forEach((line, ri) => {
                svg.appendChild(svgEl('circle', {
                    cx: x + (ri - (st.ix.length - 1) / 2) * 7,
                    cy: y + r + 5,
                    r: '3',
                    fill: LINE_COLORS[line] || '#888',
                    stroke: '#edeeed', 'stroke-width': '0.5',
                    opacity: op,
                }));
            });
        }

        // Label (only for current, next, and interchange stations)
        if (isCur || isNext || hasIx) {
            // Decide label position: push away from centre of oval
            // oval centre ≈ (230, 120)
            const cx = 230, cy = 120;
            const dx = x - cx, dy = y - cy;
            const len = Math.sqrt(dx*dx + dy*dy) || 1;
            const offset = r + (hasIx ? 11 : 8);
            const lx = x + (dx / len) * offset;
            const ly = y + (dy / len) * offset;

            svg.appendChild(svgEl('text', {
                x: lx, y: ly,
                'text-anchor': 'middle',
                'dominant-baseline': 'middle',
                'font-family': 'LTAIdentity, sans-serif',
                'font-size': isCur ? '7' : isNext ? '6.5' : '5.5',
                'font-weight': isCur || isNext ? '700' : 'normal',
                fill: isCur ? '#c97200' : isNext ? '#333' : '#444',
                opacity: isPast && !isCur && !isNext ? '0.3' : '1',
            }, st.n));
        }

        // ▼ Downward arrow above current station dot
        if (isCur) {
            // Triangle pointing DOWN, tip at top of the dot
            const aw = 10, ah = 10;
            // position it above the dot (in the direction away from centre)
            const cx = 230, cy = 120;
            const dx = x - cx, dy = y - cy;
            const len = Math.sqrt(dx*dx + dy*dy) || 1;
            // arrow sits just outside the dot on the outward side
            const ax2 = x - (dx / len) * (r + 2);
            const ay2 = y - (dy / len) * (r + 2);
            // perpendicular
            const px = -dy / len, py = dx / len;
            // downward-pointing triangle: tip points toward dot
            svg.appendChild(svgEl('polygon', {
                points: [
                    `${ax2},${ay2}`,
                    `${ax2 - (dx/len)*ah + px*aw/2},${ay2 - (dy/len)*ah + py*aw/2}`,
                    `${ax2 - (dx/len)*ah - px*aw/2},${ay2 - (dy/len)*ah - py*aw/2}`,
                ].join(' '),
                fill: LINE_COLORS.CCL,
            }));
        }
    });
}

// ═══════════════════════════
// LED TEXT
// ═══════════════════════════
const LED_TEXTS = {
    station: () => {
        const cur = getCur(), next = getNext();
        if (loc === 'station') {
            return `Doors open on the ${cur.door === 'L' ? 'LEFT' : 'RIGHT'}   ·   Next station, ${next.n} (${next.c})   ·   `;
        }
        return `Next station, ${next.n} (${next.c})   ·   Doors will open on the ${next.door === 'L' ? 'LEFT' : 'RIGHT'}   ·   ${dir === 'cw' ? 'Clockwise' : 'Anticlockwise'} service   ·   `;
    },
    courtesy: () => `Please give up your seat to those who need it more — the elderly, pregnant women, and passengers with young children.   ·   `,
    gap:      () => `Please mind the platform gap.   ·   Watch your step.   ·   `,
    closing:  () => `Doors closing`,
    terminus: () => {
        const next = getNext();
        return `Next station, ${next.n}. This train service ends immediately, please alight immediately.   ·   `;
    },
};

function updateLED() {
    const el = document.getElementById('ledText');
    if (textMode === 'closing') {
        el.textContent = 'Doors closing';
        el.classList.add('static');
        el.style.animation = 'none';
    } else {
        const t = LED_TEXTS[textMode]();
        el.textContent = t + t;
        el.classList.remove('static');
        el.style.animation = 'none';
        void el.offsetWidth;
        el.style.animation = '';
    }
}

// ═══════════════════════════
// DOOR TRIANGLES + DIRECTION ARROWS
// ═══════════════════════════
function updateDoors() {
    const st     = loc === 'station' ? getCur() : getNext();
    const atStn  = loc === 'station';
    const isLeft = st.door === 'L';
    const tL     = document.getElementById('triLeft');
    const tR     = document.getElementById('triRight');

    tL.className = 'door-tri' + (isLeft  ? ' active' : '') + (isLeft  && atStn ? ' blink' : '');
    tR.className = 'door-tri' + (!isLeft ? ' active' : '') + (!isLeft && atStn ? ' blink' : '');

    // Direction arrows: CW = ↻ on right side, CCW = ↺ on left side
    document.getElementById('arrowLeft').textContent  = dir === 'ccw' ? '↺' : '';
    document.getElementById('arrowRight').textContent = dir === 'cw'  ? '↻' : '';
}

// ═══════════════════════════
// LEGEND
// ═══════════════════════════
function buildLegend() {
    const el = document.getElementById('legend');
    el.innerHTML = '';
    [
        ['NSL', 'North-South Line'],
        ['EWL', 'East-West Line'],
        ['NEL', 'North East Line'],
        ['CCL', 'Circle Line'],
        ['DTL', 'Downtown Line'],
        ['TEL', 'Thomson-East Coast Line'],
    ].forEach(([code, name]) => {
        const row = document.createElement('div');
        row.className = 'legend-item';
        row.innerHTML = `<div class="legend-line" style="background:${LINE_COLORS[code]}"></div><span>${name}</span>`;
        el.appendChild(row);
    });
}

// ═══════════════════════════
// ANIMATION LOOP
// ═══════════════════════════
function animate(ts) {
    if (!lastT) lastT = ts;
    const dt = ts - lastT;
    lastT = ts;

    if (loc === 'train' && textMode === 'station') {
        if (!animate._acc) animate._acc = 0;
        animate._acc += dt;
        if (animate._acc >= TRAVEL) {
            animate._acc = 0;
            curIdx = nxtIdx(curIdx, dir);
            updateDoors();
            updateLED();
            updateStationBtns();
            buildMap();
        }
    } else {
        animate._acc = 0;
    }
    requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

// ═══════════════════════════
// CONTROLS
// ═══════════════════════════
function setDir(d) {
    dir = d; lastT = null; animate._acc = 0;
    document.getElementById('btnCW').classList.toggle('on',  d === 'cw');
    document.getElementById('btnCCW').classList.toggle('on', d === 'ccw');
    updateDoors(); updateLED(); buildMap();
}

function setLoc(l) {
    loc = l; lastT = null; animate._acc = 0;
    document.getElementById('btnTrain').classList.toggle('on',   l === 'train');
    document.getElementById('btnStation').classList.toggle('on', l === 'station');
    updateDoors(); updateLED(); buildMap();
}

document.getElementById('textBtns').addEventListener('click', e => {
    const btn = e.target.closest('[data-t]');
    if (!btn) return;
    textMode = btn.dataset.t;
    lastT = null; animate._acc = 0;
    document.querySelectorAll('#textBtns .btn').forEach(b => b.classList.toggle('on', b === btn));
    updateLED();
});

function buildStationBtns() {
    const wrap = document.getElementById('stationBtns');
    CCL.forEach((st, i) => {
        const b = document.createElement('button');
        b.className = 'sbtn' + (i === curIdx ? ' on' : '');
        b.textContent = `${st.c} ${st.n}`;
        b.addEventListener('click', () => {
            curIdx = i; lastT = null; animate._acc = 0;
            updateDoors(); updateLED(); updateStationBtns(); buildMap();
        });
        wrap.appendChild(b);
    });
}
function updateStationBtns() {
    document.querySelectorAll('#stationBtns .sbtn').forEach((b, i) => {
        b.classList.toggle('on', i === curIdx);
    });
}

// ═══════════════════════════
// INIT
// ═══════════════════════════
buildLegend();
buildStationBtns();
updateDoors();
updateLED();
buildMap();
</script>
</body>
</html>
