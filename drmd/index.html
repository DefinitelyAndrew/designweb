<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMRT Circle Line Station Display</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .display-container {
            background: #1e1e1e;
            border: 4px solid #ff9e1b; /* CCL Orange */
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(255, 158, 27, 0.3);
            width: 600px;
            max-width: 90%;
            position: relative;
        }
        .station-code {
            font-size: 28px;
            font-weight: bold;
            color: #ff9e1b;
            margin-bottom: 5px;
            background: #121212;
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            border: 2px solid #ff9e1b;
        }
        .station-name {
            font-size: 42px;
            font-weight: 800;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .status-box {
            font-size: 20px;
            font-weight: 600;
            padding: 12px 24px;
            border-radius: 8px;
            background: rgba(255, 158, 27, 0.15);
            color: #ff9e1b;
            display: inline-block;
            margin-bottom: 20px;
        }
        
        /* The Actual Circle */
        .circle-container {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto 25px auto;
        }
        .circle-ring {
            width: 100%;
            height: 100%;
            border: 8px solid transparent;
            border-top: 8px solid #ff9e1b;
            border-right: 8px solid #ff9e1b;
            border-radius: 50%;
            animation: spinRing 3s linear infinite;
        }
        .circle-ring::after {
            content: '';
            position: absolute;
            top: -8px; left: -8px; right: -8px; bottom: -8px;
            border: 8px solid rgba(255, 158, 27, 0.3);
            border-radius: 50%;
            z-index: -1;
        }
        .circle-inner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 16px;
            font-weight: bold;
            color: #ff9e1b;
            text-align: center;
            line-height: 1.2;
        }
        @keyframes spinRing {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Doors Indicator */
        .door-container {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 10px;
            margin-bottom: 30px;
            height: 30px; /* Fixed height so layout doesn't jump */
        }
        .door-indicator {
            font-size: 20px;
            font-weight: bold;
            color: #39ff14; /* Neon green often used in train displays */
            opacity: 0;
            text-shadow: 0 0 10px rgba(57, 255, 20, 0.6);
        }
        .door-left {
            text-align: left;
        }
        .door-right {
            text-align: right;
        }
        .blink-animation {
            animation: blinkFast 0.8s step-end infinite;
        }
        @keyframes blinkFast {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Button */
        .btn {
            background-color: #ff9e1b;
            color: #121212;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 10px rgba(255, 158, 27, 0.4);
        }
        .btn:hover {
            background-color: #ffa834;
            transform: translateY(-2px);
        }
        .btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="display-container">
        <div class="circle-container">
            <div class="circle-ring"></div>
            <div class="circle-inner" id="lineName">CIRCLE<br>LINE</div>
        </div>
        
        <div class="station-code" id="stationCode">CC1</div>
        <div class="station-name" id="stationName">Dhoby Ghaut</div>
        
        <div class="door-container">
            <div class="door-indicator door-left" id="doorLeft">&lt;&lt; DOORS OPENING</div>
            <div class="door-indicator door-right" id="doorRight">DOORS OPENING &gt;&gt;</div>
        </div>

        <div class="status-box" id="statusText">ARRIVING</div>
        <br>
        <button class="btn" onclick="nextStation()">Next Station</button>
    </div>

    <script>
        // Full Circle Line stations (Excluding CC18 Bukit Brown as it is currently non-operational)
        // doorSide is simulated based on a single direction of travel. You can edit 'left' or 'right' to match the exact physical platforms.
        const stations = [
            { code: "CC1", name: "Dhoby Ghaut", doorSide: "right" },
            { code: "CC2", name: "Bras Basah", doorSide: "left" },
            { code: "CC3", name: "Esplanade", doorSide: "right" },
            { code: "CC4", name: "Promenade", doorSide: "right" },
            { code: "CC5", name: "Nicoll Highway", doorSide: "left" },
            { code: "CC6", name: "Stadium", doorSide: "right" },
            { code: "CC7", name: "Mountbatten", doorSide: "left" },
            { code: "CC8", name: "Dakota", doorSide: "right" },
            { code: "CC9", name: "Paya Lebar", doorSide: "right" },
            { code: "CC10", name: "MacPherson", doorSide: "left" },
            { code: "CC11", name: "Tai Seng", doorSide: "right" },
            { code: "CC12", name: "Bartley", doorSide: "right" },
            { code: "CC13", name: "Serangoon", doorSide: "right" },
            { code: "CC14", name: "Lorong Chuan", doorSide: "left" },
            { code: "CC15", name: "Bishan", doorSide: "right" },
            { code: "CC16", name: "Marymount", doorSide: "right" },
            { code: "CC17", name: "Caldecott", doorSide: "left" },
            // CC18 Bukit Brown is skipped
            { code: "CC19", name: "Botanic Gardens", doorSide: "right" },
            { code: "CC20", name: "Farrer Road", doorSide: "left" },
            { code: "CC21", name: "Holland Village", doorSide: "right" },
            { code: "CC22", name: "Buona Vista", doorSide: "right" },
            { code: "CC23", name: "one-north", doorSide: "left" },
            { code: "CC24", name: "Kent Ridge", doorSide: "right" },
            { code: "CC25", name: "Haw Par Villa", doorSide: "left" },
            { code: "CC26", name: "Pasir Panjang", doorSide: "right" },
            { code: "CC27", name: "Labrador Park", doorSide: "right" },
            { code: "CC28", name: "Telok Blangah", doorSide: "left" },
            { code: "CC29", name: "HarbourFront", doorSide: "right" }
        ];

        let currentIndex = 0;

        function updateDisplay() {
            const station = stations[currentIndex];
            
            // Update Text
            document.getElementById("stationCode").textContent = station.code;
            document.getElementById("stationName").textContent = station.name;
            
            // Handle Door Blinking Logic
            const doorLeft = document.getElementById("doorLeft");
            const doorRight = document.getElementById("doorRight");
            
            // Reset animations by removing the class first
            doorLeft.classList.remove("blink-animation");
            doorRight.classList.remove("blink-animation");
            
            // Force DOM reflow to allow animation restart
            void doorLeft.offsetWidth; 
            void doorRight.offsetWidth;

            if (station.doorSide === "left") {
                doorLeft.classList.add("blink-animation");
                doorLeft.style.display = "block";
                doorRight.style.display = "none";
            } else {
                doorRight.classList.add("blink-animation");
                doorRight.style.display = "block";
                doorLeft.style.display = "none";
            }
        }

        function nextStation() {
            currentIndex = (currentIndex + 1) % stations.length;
            updateDisplay();
        }

        // Initial load
        updateDisplay();
    </script>

</body>
</html>
