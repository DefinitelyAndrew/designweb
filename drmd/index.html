<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRMD – Circle Line C851E</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=VT323&display=swap" rel="stylesheet">
<style>
@font-face {
    font-family: 'LTAIdentity';
    src: url('fonts/LTAIdentity-Medium.woff2') format('woff2'),
         url('fonts/LTAIdentity-Medium.woff') format('woff');
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
    background: #1e1e1e;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 20px 16px;
    font-family: 'Montserrat', sans-serif;
}

/* ═══════════════════════════════════════════════════
   DRMD PANEL — single unit, white, wide & shallow
   Matches the real C851E above-door display
═══════════════════════════════════════════════════ */
.drmd-outer {
    width: 100%;
    max-width: 980px;
    /* Metallic silver bezel */
    background: linear-gradient(180deg, #c8caca 0%, #9fa3a3 40%, #b0b4b4 100%);
    border-radius: 10px;
    padding: 5px 5px 6px 5px;
    box-shadow:
        0 4px 18px rgba(0,0,0,0.55),
        0 1px 0 rgba(255,255,255,0.25) inset,
        0 -1px 0 rgba(0,0,0,0.3) inset;
}

.drmd-panel {
    background: #e8ebe6;
    border-radius: 6px;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: stretch;
    /* Subtle inner shadow for depth */
    box-shadow: inset 0 0 10px rgba(0,0,0,0.12);
}

/* ── Door indicators ── */
/* Large glowing green triangles on each side */
.door-zone {
    flex-shrink: 0;
    width: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #e8ebe6;
    position: relative;
    z-index: 5;
}
.door-zone.left  { padding-left: 6px; }
.door-zone.right { padding-right: 6px; }

.door-tri-wrap {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* CSS triangle — big solid green */
.door-tri {
    width: 0; height: 0;
    opacity: 0.08;
    transition: opacity 0.15s, filter 0.15s;
    filter: drop-shadow(0 0 0px #39e030);
}
.door-tri.active {
    opacity: 1;
    filter:
        drop-shadow(0 0 6px #39e030)
        drop-shadow(0 0 14px rgba(57,224,48,0.6));
}
.door-tri.blink { animation: doorBlink 0.65s step-start infinite; }
@keyframes doorBlink { 50% { opacity: 0; } }

/* Left ◀ */
.door-zone.left .door-tri {
    border-top:    22px solid transparent;
    border-bottom: 22px solid transparent;
    border-right:  30px solid #39e030;
}
/* Right ▶ */
.door-zone.right .door-tri {
    border-top:    22px solid transparent;
    border-bottom: 22px solid transparent;
    border-left:   30px solid #39e030;
}

/* ── Map area (centre) ── */
.map-area {
    flex: 1;
    position: relative;
    display: flex;
    flex-direction: column;
    min-height: 0;
}

/* SVG wrap — relative container for map, capslet, legend, diamond */
.svg-wrap {
    flex: 1;
    position: relative;
    display: flex;
    flex-direction: column;
}

/* Capslet — top left corner of map area */
.map-capslet {
    position: absolute;
    top: 4px;
    left: 0px;
    display: inline-flex;
    align-items: center;
    gap: 3px;
    background: #f99d25;
    color: #000;
    font-family: 'LTAIdentity', sans-serif;
    font-size: 7px;
    padding: 2px 6px 2px 3px;
    border-radius: 20px;
    z-index: 10;
    line-height: 1;
}
.map-capslet-dot {
    width: 13px; height: 13px;
    background: #000;
    color: #f99d25;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 5.5px;
    flex-shrink: 0;
    font-family: 'LTAIdentity', sans-serif;
    font-weight: 700;
}

/* Legend top-right of map area */
.legend {
    position: absolute;
    top: 4px;
    right: 0px;
    display: flex;
    flex-direction: column;
    gap: 1.5px;
    z-index: 5;
}
.legend-item {
    display: flex;
    align-items: center;
    gap: 3px;
    font-family: 'LTAIdentity', sans-serif;
    font-size: 5.5px;
    color: #333;
    line-height: 1.2;
}
.legend-line {
    width: 12px;
    height: 3px;
    border-radius: 1.5px;
    flex-shrink: 0;
}

/* SVG map */
#networkSvg {
    display: block;
    width: 100%;
}

/* Orange diamond at bottom-centre of whole panel */
.diamond-indicator {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%) translateY(45%);
    width: 14px;
    height: 14px;
    background: #f99d25;
    border-radius: 2px;
    transform: translateX(-50%) rotate(45deg) translateY(-25%);
    z-index: 20;
    box-shadow: 0 0 6px rgba(249,157,37,0.7);
}
/* Use a positioned wrapper instead */
.diamond-wrap {
    position: absolute;
    bottom: 4px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
}
.diamond-wrap .diamond {
    width: 12px;
    height: 12px;
    background: #f99d25;
    transform: rotate(45deg);
    box-shadow: 0 0 5px rgba(249,157,37,0.8), 0 0 10px rgba(249,157,37,0.4);
}

/* ═══════════════════════════════════════════════════
   CONTROLS
═══════════════════════════════════════════════════ */
.controls {
    width: 100%;
    max-width: 980px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}
.ctrl-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    flex-wrap: wrap;
}
.ctrl-lbl {
    font-size: 10px;
    font-weight: 700;
    color: #555;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    min-width: 110px;
    padding-top: 7px;
    flex-shrink: 0;
}
.btn-grp { display: flex; gap: 6px; flex-wrap: wrap; }
.btn {
    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    font-weight: 600;
    padding: 6px 13px;
    border-radius: 7px;
    border: 1px solid #3a3a3a;
    background: #222;
    color: #666;
    cursor: pointer;
    transition: all 0.12s;
    white-space: nowrap;
}
.btn:hover { background: #2a2a2a; color: #aaa; }
.btn.on { background: #f99d25; color: #000; border-color: #f99d25; }

.station-scroll {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    max-height: 110px;
    overflow-y: auto;
    padding: 2px;
}
.sbtn {
    font-family: 'LTAIdentity', sans-serif;
    font-size: 10px;
    padding: 4px 9px;
    border-radius: 5px;
    border: 1px solid #2a2a2a;
    background: #181818;
    color: #555;
    cursor: pointer;
    transition: all 0.12s;
    white-space: nowrap;
}
/* ── LED ticker strip (above map, inside bezel) ── */
.led-outer {
    background: #111;
    border-radius: 4px 4px 0 0;
    padding: 0 8px;
    height: 36px;
    display: flex;
    align-items: center;
    overflow: hidden;
    position: relative;
    border-bottom: 1px solid #000;
    /* crosshatch dot-matrix overlay */
    background-image:
        repeating-linear-gradient(0deg,   transparent, transparent 3px, rgba(0,0,0,0.20) 3px, rgba(0,0,0,0.20) 4px),
        repeating-linear-gradient(90deg,  transparent, transparent 3px, rgba(0,0,0,0.10) 3px, rgba(0,0,0,0.10) 4px);
    background-color: #050505;
}

.led-text {
    font-family: 'VT323', monospace;
    font-size: 24px;
    color: #c8e87a;
    white-space: nowrap;
    letter-spacing: 0.06em;
    line-height: 1;
    text-shadow:
        0 0 8px #b0d040,
        0 0 2px #c8e87a,
        0 0 18px rgba(180,220,60,0.35);
    display: block;
    position: relative;
    z-index: 1;
    /* scrolling by default */
    padding-left: 100%;
    animation: ledScroll 30s linear infinite;
    will-change: transform;
}
.led-text.static {
    padding-left: 0;
    animation: none;
    width: 100%;
    text-align: center;
}
@keyframes ledScroll {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-200%); }
}

.sbtn:hover { background: #222; color: #aaa; }
.sbtn.on { background: #f99d25; color: #000; border-color: #f99d25; }
</style>
</head>

<!-- ═══════ DRMD PANEL ═══════ -->
<div class="drmd-outer">

            </div>

                </div>

                <div class="legend" id="legend"></div>

                <div class="diamond-wrap">

                </div>

    <div class="ctrl-row">

    terminus: () => {
        const next = getNext();
        return `Next station ${next.n}. This train service ends here. Please alight immediately.   ·   下一站 ${next.n}。本次列车服务到站结束，请立即下车。   ·   `;
    },
};

function updateLED() {
    const el = document.getElementById('ledText');
    if (textMode === 'closing') {
        el.textContent = 'Doors closing';
        el.classList.add('static');
        el.style.animation = 'none';
    } else {
        const t = LED_TEXTS[textMode]();
        el.textContent = t + t; // duplicate for seamless loop
        el.classList.remove('static');
        el.style.animation = 'none';
        void el.offsetWidth; // reflow to restart animation
        el.style.animation = '';
    }
}

// ═══════════════════════════════════════
// DOOR INDICATORS
// ═══════════════════════════════════════
function updateDoors() {
    const st       = loc === 'station' ? getCur() : getNext();
    const tL       = document.getElementById('triLeft');
    const tR       = document.getElementById('triRight');
    const atStation = loc === 'station';

    const isLeft  = st.door === 'L';
    const isRight = st.door === 'R';

    tL.className = 'door-tri'
        + (isLeft  ? ' active' : '')
        + (isLeft  && atStation ? ' blink' : '');
    tR.className = 'door-tri'
        + (isRight ? ' active' : '')
        + (isRight && atStation ? ' blink' : '');
}

// ═══════════════════════════════════════
// LEGEND
// ═══════════════════════════════════════
function buildLegend() {
    const el = document.getElementById('legend');
    el.innerHTML = '';
    [
        ['NSL', 'North-South Line'],
        ['EWL', 'East-West Line'],
        ['NEL', 'North East Line'],
        ['CCL', 'Circle Line'],
        ['DTL', 'Downtown Line'],
        ['TEL', 'Thomson-East Coast Line'],
    ].forEach(([code, name]) => {
        const row = document.createElement('div');
        row.className = 'legend-item';
        row.innerHTML = `<div class="legend-line" style="background:${LINE_COLORS[code]}"></div><span>${name}</span>`;
        el.appendChild(row);
    });
}

// ═══════════════════════════════════════
// MAP SVG
// ═══════════════════════════════════════
function svgEl(tag, attrs, txt) {
    const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (const [k,v] of Object.entries(attrs)) el.setAttribute(k, v);
    if (txt !== undefined) el.textContent = txt;
    return el;
}

function buildMap() {
    const svg = document.getElementById('networkSvg');
    svg.innerHTML = '';

    // Background line segments
    function drawLine(nodes, color, sw) {
        for (let i = 0; i < nodes.length - 1; i++) {
            const a = nodes[i], b = nodes[i+1];
            svg.appendChild(svgEl('line', {
                x1: a.x, y1: a.y, x2: b.x, y2: b.y,
                stroke: color, 'stroke-width': sw,
                'stroke-linecap': 'round', opacity: '0.6',
            }));
        }
    }
    drawLine(NSL_NODES, LINE_COLORS.NSL, 2.5);
    drawLine(EWL_NODES, LINE_COLORS.EWL, 2.5);
    drawLine(NEL_NODES, LINE_COLORS.NEL, 2.5);
    drawLine(DTL_NODES, LINE_COLORS.DTL, 2);
    drawLine(TEL_NODES, LINE_COLORS.TEL, 2);

    // CCL loop segments
    const cclPts = CCL.map(s => CCL_POS[s.c]);
    for (let i = 0; i < cclPts.length - 1; i++) {
        const [ax, ay] = cclPts[i], [bx, by] = cclPts[i+1];
        const passed = dir === 'cw' ? i < curIdx : i > curIdx;
        svg.appendChild(svgEl('line', {
            x1: ax, y1: ay, x2: bx, y2: by,
            stroke: LINE_COLORS.CCL, 'stroke-width': '3.5',
            'stroke-linecap': 'round',
            opacity: passed ? '0.25' : '1',
        }));
    }
    // Close loop: CC34 → CC4
    const [c34x, c34y] = CCL_POS['CC34'], [c4x, c4y] = CCL_POS['CC4'];
    svg.appendChild(svgEl('line', {
        x1: c34x, y1: c34y, x2: c4x, y2: c4y,
        stroke: LINE_COLORS.CCL, 'stroke-width': '3.5',
        'stroke-linecap': 'round', opacity: '1',
    }));

    // Other line station dots (small)
    function drawDots(nodes, lineColor) {
        nodes.forEach(s => {
            svg.appendChild(svgEl('circle', {
                cx: s.x, cy: s.y, r: '1.8',
                fill: '#fff', stroke: lineColor, 'stroke-width': '0.8', opacity: '0.75',
            }));
        });
    }
    drawDots(NSL_NODES, LINE_COLORS.NSL);
    drawDots(EWL_NODES, LINE_COLORS.EWL);
    drawDots(NEL_NODES, LINE_COLORS.NEL);
    drawDots(DTL_NODES, LINE_COLORS.DTL);
    drawDots(TEL_NODES, LINE_COLORS.TEL);

    // CCL station dots + labels
    const cur     = getCur();
    const next    = getNext();
    const curPos  = CCL_POS[cur.c];
    const nextPos = CCL_POS[next.c];

    CCL.forEach((st, i) => {
        const [x, y] = CCL_POS[st.c];
        const isCur  = st.c === cur.c;
        const isNext = st.c === next.c;
        const passed = dir === 'cw' ? i < curIdx : i > curIdx;
        const hasIx  = st.ix.length > 0;
        const op     = passed && !isCur && !isNext ? '0.3' : '1';

        // Dot sizing
        const r       = isCur ? 6 : isNext ? 5 : hasIx ? 3.5 : 2.5;
        const fill    = isCur ? '#fff' : isNext ? LINE_COLORS.CCL : '#fff';
        const stroke  = isCur ? LINE_COLORS.CCL : isNext ? '#fff' : LINE_COLORS.CCL;
        const sw      = isCur ? 2.5 : isNext ? 1.5 : 1;

        svg.appendChild(svgEl('circle', { cx: x, cy: y, r, fill, stroke, 'stroke-width': sw, opacity: op }));

        // Interchange colour rings below dot
        if (hasIx) {
            st.ix.forEach((line, ri) => {
                svg.appendChild(svgEl('circle', {
                    cx: x + (ri * 7) - (st.ix.length - 1) * 3.5,
                    cy: y + r + 5,
                    r: '2.8',
                    fill: LINE_COLORS[line] || '#888',
                    stroke: '#e8ebe6', 'stroke-width': '0.6',
                    opacity: op,
                }));
            });
        }

        // Label for current, next, or interchange stations
        if (isCur || isNext || hasIx) {
            const above  = y > 120;
            const labelY = above ? y - r - 3 : y + r + 8;
            const label  = st.n.length > 14 ? st.c : st.n;
            svg.appendChild(svgEl('text', {
                x, y: labelY,
                'text-anchor': 'middle',
                'font-family': 'LTAIdentity, sans-serif',
                'font-size': isCur || isNext ? '7.5' : '5.5',
                fill: isCur ? '#111' : isNext ? '#c97200' : '#333',
                'font-weight': isCur || isNext ? '700' : 'normal',
                opacity: passed && !isCur && !isNext ? '0.35' : '1',
            }, label));
        }
    });

    // Animated train dot — interpolated between cur & next
    const trainX = curPos[0] + (nextPos[0] - curPos[0]) * animPct;
    const trainY = curPos[1] + (nextPos[1] - curPos[1]) * animPct;
    const angle  = Math.atan2(nextPos[1] - curPos[1], nextPos[0] - curPos[0]);

    svg.appendChild(svgEl('circle', {
        cx: trainX, cy: trainY, r: '5.5',
        fill: LINE_COLORS.CCL, stroke: '#fff', 'stroke-width': '1.5',
    }));
    svg.appendChild(svgEl('circle', {
        cx: trainX + Math.cos(angle) * 2.5,
        cy: trainY + Math.sin(angle) * 2.5,
        r: '1.2', fill: '#000',
    }));
}

// ═══════════════════════════════════════
// ANIMATION LOOP
// ═══════════════════════════════════════
function animate(ts) {
    if (!lastT) lastT = ts;
    const dt = ts - lastT;
    lastT = ts;

    if (loc === 'train' && textMode === 'station') {
        animPct += dt / TRAVEL;
        if (animPct >= 1) {
            animPct = 0;
            curIdx  = nxt(curIdx, dir);
            updateDoors();
            updateLED();
            updateStationBtns();
        }
    }
    buildMap();
    requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

// ═══════════════════════════════════════
// CONTROLS
// ═══════════════════════════════════════
function setDir(d) {
    dir = d; animPct = 0; lastT = null;
    document.getElementById('btnCW').classList.toggle('on',  d === 'cw');
    document.getElementById('btnCCW').classList.toggle('on', d === 'ccw');
    updateDoors();
    updateLED();
}

function setLoc(l) {
    loc = l; animPct = 0; lastT = null;
    document.getElementById('btnTrain').classList.toggle('on',   l === 'train');
    document.getElementById('btnStation').classList.toggle('on', l === 'station');
    updateDoors();
    updateLED();
}

document.getElementById('textBtns').addEventListener('click', e => {
    const btn = e.target.closest('[data-t]');
    if (!btn) return;
    textMode = btn.dataset.t;
    lastT = null;
    document.querySelectorAll('#textBtns .btn').forEach(b => b.classList.toggle('on', b === btn));
    updateLED();
});

function buildStationBtns() {
    const wrap = document.getElementById('stationBtns');
    CCL.forEach((st, i) => {
        const b = document.createElement('button');
        b.className = 'sbtn' + (i === curIdx ? ' on' : '');
        b.textContent = `${st.c} ${st.n}`;
        b.addEventListener('click', () => {
            curIdx = i; animPct = 0; lastT = null;
            updateDoors(); updateLED(); updateStationBtns(); buildMap();
        });
        wrap.appendChild(b);
    });
}
function updateStationBtns() {
    document.querySelectorAll('#stationBtns .sbtn').forEach((b, i) => {
        b.classList.toggle('on', i === curIdx);
    });
}

// ═══════════════════════════════════════
// INIT
// ═══════════════════════════════════════
buildLegend();
buildStationBtns();
updateDoors();
updateLED();
</script>
</body>
</html>
