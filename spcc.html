<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[SPCC] Singapore Punggol Coast Corporation | Definitely_Andrew</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* ── PROJECT PAGE ── */
        .project-hero {
            position: relative;
            width: 100%;
            max-height: 520px;
            overflow: hidden;
            background: var(--surface);
        }
        .project-hero img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .project-hero::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, transparent 40%, var(--bg) 100%);
            pointer-events: none;
        }

        .project-body {
            max-width: 780px;
            margin: 0 auto;
            padding: 0 32px 80px;
        }

        .project-header {
            padding: 40px 0 32px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 40px;
        }

        .project-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            text-decoration: none;
            letter-spacing: .04em;
            text-transform: uppercase;
            margin-bottom: 24px;
            transition: color .2s;
        }
        .project-back:hover { color: var(--text); }
        .project-back svg { width: 14px; height: 14px; stroke: currentColor; }

        .project-title {
            font-size: clamp(1.6rem, 4vw, 2.4rem);
            font-weight: 800;
            letter-spacing: -.03em;
            color: #fff;
            line-height: 1.15;
            margin-bottom: 20px;
        }

        .project-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .meta-pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 14px;
            border-radius: 9999px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .07em;
            text-transform: uppercase;
            border: 1px solid var(--border);
            color: var(--muted);
            background: var(--surface);
        }
        .meta-pill.tag-games   { color: #a78bfa; border-color: rgba(167,139,250,.3); background: rgba(167,139,250,.08); }
        .meta-pill.tag-nonfiction { color: #34d399; border-color: rgba(52,211,153,.3); background: rgba(52,211,153,.08); }
        .meta-pill.date        { color: var(--accent3); border-color: rgba(6,182,212,.3); background: rgba(6,182,212,.08); }

        /* ── DISCORD-STYLE ROLE PILL ── */
        .role-pill {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 5px 12px 5px 8px;
            border-radius: 9999px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .06em;
            text-transform: uppercase;
            border: 1px solid rgba(255, 182, 213, 0.35);
            color: #ffb6d5;
            background: rgba(255, 182, 213, 0.08);
            position: relative;
            overflow: hidden;
            cursor: default;
            transition: border-color .2s, background .2s;
        }
        .role-pill:hover {
            border-color: rgba(255, 182, 213, 0.6);
            background: rgba(255, 182, 213, 0.14);
        }
        /* the dot */
        .role-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff80b5;
            box-shadow: 0 0 6px 1px rgba(255,128,181,.7);
            flex-shrink: 0;
            animation: role-pulse 2.4s ease-in-out infinite;
        }
        @keyframes role-pulse {
            0%, 100% { box-shadow: 0 0 5px 1px rgba(255,128,181,.7); opacity: 1; }
            50%       { box-shadow: 0 0 12px 3px rgba(255,128,181,.95); opacity: .85; }
        }
        /* shimmer sweep */
        .role-pill::after {
            content: '';
            position: absolute;
            top: 0; left: -80%;
            width: 60%;
            height: 100%;
            background: linear-gradient(
                105deg,
                transparent 30%,
                rgba(255,255,255,.18) 50%,
                transparent 70%
            );
            animation: role-shimmer 3.2s ease-in-out infinite;
        }
        @keyframes role-shimmer {
            0%   { left: -80%; }
            50%  { left: 130%; }
            100% { left: 130%; }
        }

        .project-section {
            margin-bottom: 40px;
        }
        .project-section-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--accent3);
            margin-bottom: 14px;
        }
        .project-section p {
            font-size: 15px;
            color: var(--muted);
            line-height: 1.8;
        }

        .project-divider {
            height: 1px;
            background: linear-gradient(to right, transparent, var(--border), transparent);
            margin: 40px 0;
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <div class="navbar-wrap">
        <nav>
            <ul class="nav-links">
                <li>
                    <a href="index.html">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M3 9.75L12 3l9 6.75V21a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.75z"/>
                            <path d="M9 22V12h6v10"/>
                        </svg>
                        Home
                    </a>
                </li>
                <li>
                    <a href="projects.html" class="nav-active">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="3" y="3" width="7" height="7" rx="1"/>
                            <rect x="14" y="3" width="7" height="7" rx="1"/>
                            <rect x="3" y="14" width="7" height="7" rx="1"/>
                            <rect x="14" y="14" width="7" height="7" rx="1"/>
                        </svg>
                        Projects
                    </a>
                </li>
                <li>
                    <a href="about.html">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="12" cy="8" r="4"/>
                            <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
                        </svg>
                        About
                    </a>
                </li>
            </ul>
        </nav>
    </div>

    <!-- HERO IMAGE -->
    <div class="project-hero">
        <img src="assets/spcc_thehubcover.png" alt="[SPCC] Singapore Punggol Coast Corporation cover">
    </div>

    <!-- CONTENT -->
    <div class="project-body">

        <div class="project-header">
            <a href="projects.html" class="project-back">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M5 12l7-7M5 12l7 7"/></svg>
                Back to Projects
            </a>

            <h1 class="project-title">[SPCC] Singapore Punggol Coast Corporation</h1>

            <div class="project-meta">
                <span class="meta-pill date">
                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
                    4 August 2026
                </span>
                <span class="meta-pill tag-games">Games</span>
                <span class="meta-pill tag-nonfiction">Nonfiction</span>
                <span class="role-pill">
                    <span class="role-dot"></span>
                    JD · Junior Developer
                </span>
            </div>
        </div>

        <div class="project-section">
            <div class="project-section-label">About</div>
            <p>Add your description here.</p>
        </div>

        <div class="project-divider"></div>

    </div>

    <!-- FOOTER -->
    <footer>
        <p>© 2026 Definitely_Andrew · All rights reserved</p>
    </footer>

    <script>
        window.addEventListener('load', () => {
            const hero = document.querySelector('.project-hero');
            const header = document.querySelector('.project-header');
            const sections = document.querySelectorAll('.project-section');

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    [hero, header, ...sections].forEach((el, i) => {
                        if (!el) return;
                        el.style.opacity = '0';
                        el.style.transform = 'translateY(30px)';
                        el.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
                        setTimeout(() => {
                            el.style.opacity = '1';
                            el.style.transform = 'translateY(0)';
                        }, i * 120);
                    });
                });
            });
        });
    </script>
</body>
</html>
