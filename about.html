<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About | Definitely_Andrew</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- NAVBAR -->
    <div class="navbar-wrap">
        <nav>
            <ul class="nav-links">
                <li>
                    <a href="index.html">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M3 9.75L12 3l9 6.75V21a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.75z"/>
                            <path d="M9 22V12h6v10"/>
                        </svg>
                        Home
                    </a>
                </li>
                <li>
                    <a href="projects.html">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="3" y="3" width="7" height="7" rx="1"/>
                            <rect x="14" y="3" width="7" height="7" rx="1"/>
                            <rect x="3" y="14" width="7" height="7" rx="1"/>
                            <rect x="14" y="14" width="7" height="7" rx="1"/>
                        </svg>
                        Projects
                    </a>
                </li>
                <li>
                    <a href="about.html" class="nav-active">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="12" cy="8" r="4"/>
                            <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
                        </svg>
                        About
                    </a>
                </li>
            </ul>
        </nav>
    </div>

    <!-- ABOUT SECTION -->
    <section class="about-section">
        <div class="about-container">

            <!-- Country -->
            <div class="about-card">
                <div class="about-card-label">Country</div>
                <div class="about-card-value">
                    <span class="flag">🇸🇬</span> Singapore
                </div>
            </div>

            <!-- Likes & Interests -->
            <div class="about-card">
                <div class="about-card-label">Likes &amp; Interests</div>
                <div class="interests-list">
                    <span class="interest-tag">🎨 Designing</span>
                    <span class="interest-tag">🎮 Creating Games</span>
                    <span class="interest-tag">😴 Sleeping</span>
                </div>
            </div>

            <!-- Language Proficiency -->
            <div class="about-card">
                <div class="about-card-label">Language Proficiency</div>
                <div class="lang-list">

                    <div class="lang-item">
                        <div class="lang-header">
                            <span class="lang-name">English</span>
                            <span class="lang-pct">100%</span>
                        </div>
                        <div class="lang-bar-bg">
                            <div class="lang-bar-fill" style="--pct: 100%"></div>
                        </div>
                    </div>

                    <div class="lang-item">
                        <div class="lang-header">
                            <span class="lang-name">Chinese</span>
                            <span class="lang-pct">94%</span>
                        </div>
                        <div class="lang-bar-bg">
                            <div class="lang-bar-fill" style="--pct: 94%"></div>
                        </div>
                    </div>

                    <div class="lang-item">
                        <div class="lang-header">
                            <span class="lang-name">Vietnamese</span>
                            <span class="lang-pct">62%</span>
                        </div>
                        <div class="lang-bar-bg">
                            <div class="lang-bar-fill" style="--pct: 62%"></div>
                        </div>
                    </div>

                    <div class="lang-item">
                        <div class="lang-header">
                            <span class="lang-name">Malay</span>
                            <span class="lang-pct">23%</span>
                        </div>
                        <div class="lang-bar-bg">
                            <div class="lang-bar-fill" style="--pct: 23%"></div>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </section>

    <!-- FOOTER -->
    <footer>
        <p>© 2026 Definitely_Andrew · All rights reserved</p>
    </footer>

    <script>
        const aboutObserver = new IntersectionObserver((entries, obs) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    // Animate language bars when card becomes visible
                    entry.target.querySelectorAll('.lang-bar-fill').forEach(bar => {
                        bar.style.width = bar.style.getPropertyValue('--pct') || '0%';
                    });
                    obs.unobserve(entry.target);
                }
            });
        }, { threshold: 0.1, rootMargin: '0px 0px -20px 0px' });

        // Small delay so browser renders opacity:0 first
        setTimeout(() => {
            document.querySelectorAll('.about-card').forEach(card => {
                aboutObserver.observe(card);
            });
        }, 60);
    </script>
</body>
</html>
